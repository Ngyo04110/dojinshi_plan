                          </div>
                          ${it.status === 'skip' ? '<div class="inline-block bg-gray-200 text-gray-600 text-[10px] px-2 py-0.5 rounded mt-1 font-bold">已放棄</div>' : ''}
                        </div>
                      </div>
                      
                      <div class="flex gap-1 shrink-0">
                        <button onclick="setItemStatus('${b.id}', '${it.id}', 'done')" class="px-2 py-1 rounded text-[11px] font-bold border ${it.status === 'done' ? 'bg-[#4A7C6F] text-white border-[#4A7C6F]' : 'bg-white text-gray-600 border-gray-200'}">買齊</button>
                        <button onclick="setItemStatus('${b.id}', '${it.id}', 'soldout')" class="px-2 py-1 rounded text-[11px] font-bold border ${it.status === 'soldout' ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-gray-600 border-gray-200'}">售空</button>
                        <button onclick="toggleSkip('${b.id}', '${it.id}')" class="px-2 py-1 rounded text-[11px] font-bold border ${it.status === 'skip' ? 'bg-gray-500 text-white border-gray-500' : 'bg-white text-gray-600 border-gray-200'}">${it.status === 'skip' ? '取消放棄' : '放棄'}</button>
                      </div>
                    </div>

                    <div class="flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-gray-200 my-2">
                      <span class="text-xs font-bold text-gray-700">
                        ${currentRunner !== 'all' ? `【${currentRunner}】總買到數量 (含代購)` : '全團總買到數量'}
                      </span>
                      <div class="flex items-center gap-2">
                        <button onclick="updateRunnerPurchaseQty('${b.id}', '${it.id}', -1)" class="w-7 h-7 rounded bg-gray-100 font-bold text-gray-600">-</button>
                        <span class="font-bold w-14 text-center ${totalBought >= totalReq ? 'text-[#4A7C6F]' : 'text-[#D96B43]'}">
                          ${currentRunner !== 'all' ? `${runnerPurchasedCount} 件` : `${totalBought}/${totalReq}`}
                        </span>
                        <button onclick="updateRunnerPurchaseQty('${b.id}', '${it.id}', 1)" class="w-7 h-7 rounded bg-[#4A7C6F]/15 font-bold text-[#4A7C6F]">+</button>
                      </div>
                    </div>

                    <div>
                      <button onclick="toggleRunItemExpand('${it.id}')" class="text-xs text-[#4A7C6F] font-medium flex items-center gap-1 hover:underline py-1">
                        <i class="fa-solid fa-chevron-${isExpanded ? 'up' : 'down'} text-[10px]"></i>
                        ${isExpanded ? '收起成員明細' : '展開成員明細 (按人分配)'}
                      </button>

                      ${isExpanded ? `
                        <div class="space-y-1.5 pt-2 mt-1 border-t border-gray-200/60 bg-white/60 p-2.5 rounded-xl">
                          ${state.members.map(m => {
                            const ord = (it.orders && it.orders[m]) || { req: 0, bought: 0 };
                            if (ord.req === 0 && ord.bought === 0) return '';
                            return `
                              <div class="flex justify-between items-center text-xs">
                                <span class="font-medium text-gray-700">${m} <span class="text-gray-400">(需求 ${ord.req})</span></span>
                                <div class="flex items-center gap-2 bg-white px-2 py-1 rounded-lg border border-gray-200">
                                  <button onclick="updateBoughtQty('${b.id}', '${it.id}', '${m}', -1)" class="w-6 h-6 rounded bg-gray-100 font-bold text-gray-600">-</button>
                                  <span class="font-bold w-8 text-center ${ord.bought >= ord.req ? 'text-[#4A7C6F]' : 'text-[#D96B43]'}">${ord.bought}/${ord.req}</span>
                                  <button onclick="updateBoughtQty('${b.id}', '${it.id}', '${m}', 1)" class="w-6 h-6 rounded bg-[#4A7C6F]/15 font-bold text-[#4A7C6F]">+</button>
                                </div>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
      initDragAndDrop();
    }

    function selectRunner(runnerName) {
      state.activeRunner = runnerName;
      render();
    }

    function openAddRunnerModal() {
      const evId = state.activeEventId;
      const existingRunners = (state.runnersByEvent && state.runnersByEvent[evId]) || [];
      const availableMembers = state.members.filter(m => !existingRunners.includes(m));

      showModal(`
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-base">新建跑攤人</h3>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div class="space-y-4">
          <div>
            <label class="text-xs font-bold text-gray-700 block mb-2">1. 從現有成員名單挑選：</label>
            ${availableMembers.length === 0 ? '<div class="text-xs text-gray-400">所有現有成員皆已加入跑攤人名單</div>' : `
              <div class="flex flex-wrap gap-2">
                ${availableMembers.map(m => `
                  <button type="button" onclick="confirmAddRunner('${m}')" class="px-3.5 py-1.5 rounded-full bg-[#4A7C6F]/10 text-[#4A7C6F] text-xs font-bold hover:bg-[#4A7C6F] hover:text-white transition">
                    + ${m}
                  </button>
                `).join('')}
              </div>
            `}
          </div>

          <div class="pt-3 border-t">
            <label class="text-xs font-bold text-gray-700 block mb-1.5">2. 或即時輸入新成員並設為跑攤人：</label>
            <div class="flex gap-2">
              <input id="instant-new-runner-name" type="text" placeholder="輸入新成員名字 (例: 小幫手B)" class="flex-1 border rounded-xl px-3 py-2 text-sm" />
              <button type="button" onclick="createAndAddRunner()" class="btn-primary px-4 py-2 rounded-xl text-xs font-bold">新增並加入</button>
            </div>
          </div>
        </div>
      `);
    }

    function confirmAddRunner(name) {
      const evId = state.activeEventId;
      if (!state.runnersByEvent[evId]) state.runnersByEvent[evId] = [];
      if (!state.runnersByEvent[evId].includes(name)) {
        state.runnersByEvent[evId].push(name);
      }
      state.activeRunner = name;
      closeModal();
      saveData();
      render();
    }

    function createAndAddRunner() {
      const inp = document.getElementById('instant-new-runner-name');
      if (!inp) return;
      const name = inp.value.trim();
      if (!name) return alert('請輸入名稱');
      if (!state.members.includes(name)) {
        state.members.push(name);
      }
      confirmAddRunner(name);
    }

    function openEditRunnersModal() {
      const evId = state.activeEventId;
      const existingRunners = (state.runnersByEvent && state.runnersByEvent[evId]) || [];
      showModal(`
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-base">編輯跑攤人名單</h3>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div class="space-y-2">
          ${existingRunners.length === 0 ? '<div class="text-xs text-gray-400 py-4 text-center">尚未新增任何跑攤人</div>' : existingRunners.map((r, idx) => `
            <div class="flex justify-between items-center bg-gray-50 px-3 py-2.5 rounded-xl text-sm font-bold">
              <span>${r}</span>
              <button onclick="removeRunnerFromEvent(${idx})" class="text-red-500 text-xs px-2 py-1 bg-red-50 rounded-lg">移除跑攤人</button>
            </div>
          `).join('')}
        </div>
      `);
    }

    function removeRunnerFromEvent(idx) {
      const evId = state.activeEventId;
      const removed = state.runnersByEvent[evId].splice(idx, 1)[0];
      if (state.activeRunner === removed) state.activeRunner = 'all';
      saveData();
      openEditRunnersModal();
    }

    function applyRunnerOrderPreset(type) {
      const runner = state.activeRunner;
      if (!runner || runner === 'all' || !type) return;
      const ev = state.events[state.activeEventId];
      if (!ev || !ev.booths) return;

      if (!state.runnerOrders[ev.id]) state.runnerOrders[ev.id] = {};

      if (type === 'default') {
        state.runnerOrders[ev.id][runner] = Object.values(ev.booths).sort((a, b) => (a.order || 0) - (b.order || 0)).map(b => b.id);
      } else if (type === 'az') {
        state.runnerOrders[ev.id][runner] = Object.values(ev.booths).sort((a, b) => (a.code || '').localeCompare(b.code || '', undefined, { numeric: true, sensitivity: 'base' })).map(b => b.id);
      } else {
        const otherOrder = state.runnerOrders[ev.id][type] || Object.values(ev.booths).sort((a, b) => (a.order || 0) - (b.order || 0)).map(b => b.id);
        state.runnerOrders[ev.id][runner] = [...otherOrder];
      }
      saveData();
      render();
    }

    function updateRunnerPurchaseQty(boothId, itemId, delta) {
      const runner = state.activeRunner || 'all';
      const item = state.events[state.activeEventId].booths[boothId].items[itemId];
      if (item.divisionCompleted) item.divisionCompleted = false;

      if (runner !== 'all') {
        if (!item.purchasedBy) item.purchasedBy = {};
        const prev = item.purchasedBy[runner] || 0;
        const next = Math.max(0, prev + delta);
        const actualDelta = next - prev;
        if (actualDelta === 0) return;
        item.purchasedBy[runner] = next;

        updateTotalBoughtQty(boothId, itemId, actualDelta, runner);
      } else {
        updateTotalBoughtQty(boothId, itemId, delta, state.members[0]);
      }
    }

    function updateTotalBoughtQty(boothId, itemId, delta, preferredMember = null) {
      const item = state.events[state.activeEventId].booths[boothId].items[itemId];
      const members = state.members;
      if (item.divisionCompleted) item.divisionCompleted = false;

      if (delta > 0) {
        const totalReq = members.reduce((s, m) => s + ((item.orders[m] && item.orders[m].req) || 0), 0);
        const currentTotalBought = members.reduce((s, m) => s + ((item.orders[m] && item.orders[m].bought) || 0), 0);

        if (currentTotalBought >= totalReq && totalReq > 0) {
          // 超買
        } else {
          let targetM = null;
          if (preferredMember && item.orders[preferredMember] && (item.orders[preferredMember].req || 0) > 0 && item.orders[preferredMember].bought < item.orders[preferredMember].req) {
            targetM = preferredMember;
          } else {
            targetM = members.find(m => {
              const o = item.orders[m] || { req: 0, bought: 0 };
              return (o.req || 0) > 0 && o.bought < o.req;
            });
          }
          if (targetM) {
            if (!item.orders[targetM]) item.orders[targetM] = { req: 0, bought: 0 };
            item.orders[targetM].bought += delta;
          }
        }
      } else if (delta < 0) {
        let targetM = members.slice().reverse().find(m => {
          const o = item.orders[m] || { req: 0, bought: 0 };
          return o.bought > 0;
        }) || members[0];
        if (!item.orders[targetM]) item.orders[targetM] = { req: 0, bought: 0 };
        item.orders[targetM].bought = Math.max(0, item.orders[targetM].bought + delta);
      }

      const totalReq = members.reduce((s, m) => s + ((item.orders[m] && item.orders[m].req) || 0), 0);
      const updatedTotal = members.reduce((s, m) => s + ((item.orders[m] && item.orders[m].bought) || 0), 0);
      const allMet = totalReq > 0 && updatedTotal >= totalReq;
      if (allMet && updatedTotal > 0) item.status = 'done';
      else if (item.status === 'done' && !allMet) item.status = 'pending';

      saveData();
    }

    function toggleBoothSashiireGiven(boothId, memberName, isChecked) {
      const booth = state.events[state.activeEventId].booths[boothId];
      const authors = getBoothAuthors(booth);
      authors.forEach(a => {
        if ((a.sashiire || []).includes(memberName)) {
          if (!a.sashiireGiven) a.sashiireGiven = {};
          a.sashiireGiven[memberName] = isChecked;
        }
      });
      booth.authors = authors;
      saveData();
    }

    function toggleRunItemExpand(itemId) {
      state.expandedRunItems[itemId] = !state.expandedRunItems[itemId];
      render();
    }

    // ------------------------------------------
    // 分頁 3：分帳結算與商品瓜分
    // ------------------------------------------
    function renderSettleTab(container) {
      const evList = getSortedEvents();
      if (evList.length === 0) {
        container.innerHTML = `<div class="card p-8 text-center text-gray-400">尚無活動資料</div>`;
        return;
      }

      if (!state.settleEventId || !state.events[state.settleEventId]) {
        state.settleEventId = evList[0].id;
      }
      const currentEv = state.events[state.settleEventId];
      const eventRunners = (state.runnersByEvent && state.runnersByEvent[currentEv.id]) || [];

      let planTotal = 0;
      let boughtTotal = 0;
      let pendingTotal = 0;
      let doneBoothsCount = 0;

      const runnerSpentMap = {};
      eventRunners.forEach(r => { runnerSpentMap[r] = 0; });

      const booths = Object.values(currentEv.booths || {});
      booths.forEach(b => {
        const items = Object.values(b.items || {});
        
        const isBoothDone = items.length > 0 && items.every(it => {
          const totalReq = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].req) || 0), 0);
          const totalBought = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].bought) || 0), 0);
          return it.status !== 'pending' || it.divisionCompleted || totalBought >= totalReq;
        });
        if (isBoothDone) doneBoothsCount++;

        items.forEach(it => {
          const totalReq = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].req) || 0), 0);
          const totalBought = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].bought) || 0), 0);
          const isDivisionItem = totalBought > 0 && totalBought < totalReq;

          if (it.purchasedBy) {
            Object.entries(it.purchasedBy).forEach(([rName, cnt]) => {
              if (runnerSpentMap[rName] !== undefined) {
                runnerSpentMap[rName] += cnt * it.price;
              }
            });
          }

          state.members.forEach(m => {
            const ord = (it.orders && it.orders[m]) || { req: 0, bought: 0 };
            const reqCost = ord.req * it.price;
            const bCost = ord.bought * it.price;

            planTotal += reqCost;
            boughtTotal += bCost;

            if (it.status === 'pending' && !isDivisionItem) {
              pendingTotal += Math.max(0, (ord.req - ord.bought) * it.price);
            }
          });
        });
      });

      const divisionItems = [];
      booths.forEach(b => {
        Object.values(b.items || {}).forEach(it => {
          const totalReq = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].req) || 0), 0);
          const totalBought = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].bought) || 0), 0);
          if (totalBought > 0 && totalBought < totalReq) {
            divisionItems.push({
              boothId: b.id, itemId: it.id, boothCode: b.code, circle: b.circle,
              itemName: it.name, price: it.price, totalReq, totalBought,
              itemImage: it.itemImage, divisionCompleted: !!it.divisionCompleted
            });
          }
        });
      });

      const pendingDivision = divisionItems.filter(i => !i.divisionCompleted);
      const completedDivision = divisionItems.filter(i => i.divisionCompleted);

      let html = `
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1 mb-3">
          ${evList.map(ev => `
            <button onclick="selectSettleEvent('${ev.id}')" class="px-3.5 py-1.5 rounded-full text-sm font-medium whitespace-nowrap transition shrink-0 ${ev.id === state.settleEventId ? 'bg-[#4A7C6F] text-white shadow-sm' : 'bg-white text-gray-600'}">
              ${ev.name} ${ev.date ? `(${ev.date})` : ''}
            </button>
          `).join('')}
        </div>

        <div class="card p-4 mb-4">
          <div class="text-sm font-bold text-gray-700 mb-3">金額記錄 · ${currentEv.name}</div>
          <div class="grid grid-cols-2 gap-2.5 mb-3">
            <div class="bg-[#F4F5F0] p-3 rounded-xl">
              <div class="text-xs text-gray-500">原計劃預算</div>
              <div class="text-lg font-bold text-gray-800 mt-1">${formatCurrency(planTotal, currentEv.id)}</div>
            </div>
            <div class="bg-[#F4F5F0] p-3 rounded-xl">
              <div class="text-xs text-gray-500">還要買 (待購)</div>
              <div class="text-lg font-bold text-[#D96B43] mt-1">${formatCurrency(pendingTotal, currentEv.id)}</div>
            </div>
            <div class="bg-[#4A7C6F]/10 p-3 rounded-xl">
              <div class="text-xs text-[#4A7C6F] font-medium">已購買總額</div>
              <div class="text-xl font-bold text-[#4A7C6F] mt-1">${formatCurrency(boughtTotal, currentEv.id)}</div>
            </div>
            <div class="bg-[#4A7C6F]/10 p-3 rounded-xl">
              <div class="text-xs text-[#4A7C6F] font-medium">完成攤位</div>
              <div class="text-xl font-bold text-[#4A7C6F] mt-1">${doneBoothsCount} / ${booths.length} 攤</div>
            </div>
          </div>

          <div class="pt-3 border-t border-gray-100">
            <div class="text-xs font-bold text-gray-600 mb-2"><i class="fa-solid fa-person-walking mr-1 text-[#4A7C6F]"></i>各跑攤人成功購買金額：</div>
            <div class="flex flex-wrap gap-2">
              ${eventRunners.length === 0 ? '<div class="text-xs text-gray-400">尚未新增跑攤人</div>' : eventRunners.map(r => `
                <div class="bg-[#F9FAF8] px-3 py-1.5 rounded-xl border border-gray-200 text-xs flex items-center gap-2">
                  <span class="font-bold text-gray-700">${r}</span>
                  <span class="font-bold text-[#4A7C6F]">${formatCurrency(runnerSpentMap[r] || 0, currentEv.id)}</span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>

        <!-- 商品瓜分區塊 -->
        <div class="card p-4 mb-4 border-2 border-[#4A7C6F]/20">
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-base text-gray-800"><i class="fa-solid fa-pie-chart text-[#4A7C6F] mr-1.5"></i>商品瓜分 (買不齊分配)</h3>
            <div class="flex bg-gray-100 p-1 rounded-xl text-xs">
              <button onclick="setDivisionSubTab('pending')" class="relative px-3 py-1.5 rounded-lg font-bold transition ${state.settleDivisionSubTab === 'pending' ? 'bg-[#4A7C6F] text-white shadow-sm' : 'text-gray-600'}">
                未完成瓜分
                ${pendingDivision.length > 0 ? `<span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-500 rounded-full ring-2 ring-white"></span>` : ''}
              </button>
              <button onclick="setDivisionSubTab('completed')" class="px-3 py-1.5 rounded-lg font-bold transition ${state.settleDivisionSubTab === 'completed' ? 'bg-[#4A7C6F] text-white shadow-sm' : 'text-gray-600'}">
                已完成瓜分 (${completedDivision.length})
              </button>
            </div>
          </div>

          ${state.settleDivisionSubTab === 'pending' ? `
            <div class="space-y-3">
              ${pendingDivision.length === 0 ? '<div class="text-center text-xs text-gray-400 py-6">目前沒有買不齊且需要瓜分的商品</div>' : pendingDivision.map(item => {
                const itObj = state.events[state.settleEventId].booths[item.boothId].items[item.itemId];
                const validMembersForDivision = state.members.filter(m => ((itObj.orders && itObj.orders[m] && itObj.orders[m].req) || 0) > 0);

                if (!state.divisionEdits[item.itemId]) {
                  state.divisionEdits[item.itemId] = {};
                  validMembersForDivision.forEach(m => {
                    state.divisionEdits[item.itemId][m] = (itObj.orders && itObj.orders[m] && itObj.orders[m].bought) || 0;
                  });
                }
                const tempEdits = state.divisionEdits[item.itemId];
                const currentSumTemp = validMembersForDivision.reduce((s, m) => s + (tempEdits[m] || 0), 0);
                const isMatch = currentSumTemp === item.totalBought;

                return `
                  <div class="bg-[#F9FAF8] p-3.5 rounded-xl border border-gray-200 space-y-2.5">
                    <div class="flex justify-between items-center">
                      <div class="flex items-center gap-2.5">
                        ${item.itemImage ? `<img src="${item.itemImage}" class="w-11 h-11 object-cover rounded-lg border shrink-0" />` : ''}
                        <div>
                          <div class="text-xs font-bold text-[#4A7C6F]">${item.boothCode} ${item.circle}</div>
                          <div class="text-sm font-medium text-gray-800">${item.itemName} (${formatCurrency(item.price, currentEv.id)})</div>
                        </div>
                      </div>
                      <div class="text-xs font-bold text-[#D96B43] bg-amber-50 px-2 py-1 rounded-lg border border-amber-200">
                        實際買到: ${item.totalBought} / 需求: ${item.totalReq}
                      </div>
                    </div>

                    <div class="bg-white p-3 rounded-xl border space-y-2">
                      <div class="text-[11px] font-bold text-gray-600">分配誰獲得這 ${item.totalBought} 件商品：</div>
                      <div class="space-y-1.5">
                        ${validMembersForDivision.map(m => {
                          const val = tempEdits[m] || 0;
                          return `
                            <div class="flex justify-between items-center text-xs">
                              <span class="font-medium text-gray-700">${m} <span class="text-gray-400">(需求 ${itObj.orders[m].req})</span></span>
                              <div class="flex items-center gap-2 bg-gray-50 px-2 py-1 rounded-lg border">
                                <button onclick="updateDivisionTempBought('${item.boothId}', '${item.itemId}', '${m}', -1)" class="w-6 h-6 rounded bg-white font-bold text-gray-600 shadow-sm border">-</button>
                                <span class="font-bold w-8 text-center text-[#4A7C6F]">${val}</span>
                                <button onclick="updateDivisionTempBought('${item.boothId}', '${item.itemId}', '${m}', 1)" class="w-6 h-6 rounded bg-[#4A7C6F]/15 font-bold text-[#4A7C6F]">+</button>
                              </div>
                            </div>
                          `;
                        }).join('')}
                      </div>
                      <div class="flex justify-between items-center pt-2.5 border-t text-xs">
                        <span class="${isMatch ? 'text-emerald-600 font-bold' : 'text-amber-600 font-bold'}">
                          分配總數: ${currentSumTemp} / ${item.totalBought} ${isMatch ? '✓' : '(需相符)'}
                        </span>
                        <button onclick="completeDivision('${item.boothId}', '${item.itemId}')" class="btn-primary px-3.5 py-1.5 rounded-xl text-xs font-bold shadow-sm">
                          完成瓜分
                        </button>
                      </div>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          ` : `
            <div class="space-y-3">
              ${completedDivision.length === 0 ? '<div class="text-center text-xs text-gray-400 py-6">目前沒有已完成瓜分的商品</div>' : completedDivision.map(item => {
                const itObj = state.events[state.settleEventId].booths[item.boothId].items[item.itemId];
                return `
                  <div class="bg-[#F9FAF8] p-3.5 rounded-xl border border-gray-200 flex justify-between items-center">
                    <div class="flex items-center gap-2.5">
                      ${item.itemImage ? `<img src="${item.itemImage}" class="w-11 h-11 object-cover rounded-lg border shrink-0" />` : ''}
                      <div>
                        <div class="text-xs font-bold text-[#4A7C6F]">${item.boothCode} ${item.circle}</div>
                        <div class="text-sm font-medium text-gray-800">${item.itemName}</div>
                        <div class="text-xs text-gray-500 mt-0.5 font-medium">
                          分配結果：${state.members.map(m => {
                            const b = (itObj.orders && itObj.orders[m] && itObj.orders[m].bought) || 0;
                            return b > 0 ? `${m}獲得${b}本` : '';
                          }).filter(Boolean).join('、') || '無分配'}
                        </div>
                      </div>
                    </div>
                    <div class="flex items-center gap-2 shrink-0">
                      <span class="text-[11px] px-2 py-1 rounded-lg bg-emerald-100 text-emerald-700 font-bold">已瓜分</span>
                      <button onclick="editDivision('${item.boothId}', '${item.itemId}')" class="px-3 py-1.5 rounded-lg bg-gray-200 text-gray-700 text-xs font-bold hover:bg-gray-300">
                        編輯
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>

        <div class="text-sm font-bold text-gray-700 mb-2 px-1">按人分開算 · 點擊成員查看希望商品、通販待購與 差し入れ 明細</div>
        <div class="space-y-3">
          ${state.members.map(m => {
            let mBoughtCost = 0;
            let mPlanCost = 0;
            booths.forEach(b => {
              Object.values(b.items || {}).forEach(it => {
                const ord = (it.orders && it.orders[m]) || { req: 0, bought: 0 };
                mPlanCost += ord.req * it.price;
                mBoughtCost += ord.bought * it.price;
              });
            });

            return `
              <div class="card p-4 cursor-pointer hover:bg-gray-50 transition" onclick="openMemberDetailModal('${m}', '${currentEv.id}')">
                <div class="flex justify-between items-center">
                  <div class="flex items-center gap-2">
                    <span class="w-7 h-7 rounded-full bg-[#4A7C6F] text-white text-xs font-bold flex items-center justify-center">${m[0]}</span>
                    <span class="font-bold text-base text-gray-800">${m}</span>
                    <span class="text-xs text-[#4A7C6F] bg-[#4A7C6F]/10 px-2 py-0.5 rounded ml-2">查看明細 <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
                  </div>
                  <div class="flex gap-4 text-right">
                    <div>
                      <div class="text-[10px] text-gray-400">預算</div>
                      <div class="text-sm font-bold text-gray-600">${formatCurrency(mPlanCost, currentEv.id)}</div>
                    </div>
                    <div>
                      <div class="text-[10px] text-gray-400">實買應付</div>
                      <div class="text-base font-bold text-[#D96B43]">${formatCurrency(mBoughtCost, currentEv.id)}</div>
                    </div>
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;

      container.innerHTML = html;
    }

    function setDivisionSubTab(subTab) { state.settleDivisionSubTab = subTab; render(); }

    function updateDivisionTempBought(boothId, itemId, member, delta) {
      if (!state.divisionEdits[itemId]) {
        state.divisionEdits[itemId] = {};
        const item = state.events[state.settleEventId].booths[boothId].items[itemId];
        state.members.forEach(m => {
          state.divisionEdits[itemId][m] = (item.orders && item.orders[m] && item.orders[m].bought) || 0;
        });
      }
      const currentVal = state.divisionEdits[itemId][member] || 0;
      state.divisionEdits[itemId][member] = Math.max(0, currentVal + delta);
      render();
    }

    function completeDivision(boothId, itemId) {
      const item = state.events[state.settleEventId].booths[boothId].items[itemId];
      const totalBought = state.members.reduce((s, m) => s + ((item.orders && item.orders[m] && item.orders[m].bought) || 0), 0);
      const tempEdits = state.divisionEdits[itemId];
      const validMembers = Object.keys(tempEdits || {});
      const tempSum = validMembers.reduce((s, m) => s + (tempEdits[m] || 0), 0);

      if (tempSum !== totalBought) {
        alert(`分配總數 (${tempSum}) 與實際買到總數 (${totalBought}) 不符，請調整各成員分配數至相符後再點擊完成瓜分！`);
        return;
      }

      validMembers.forEach(m => {
        if (!item.orders[m]) item.orders[m] = { req: 0, bought: 0 };
        item.orders[m].bought = tempEdits[m] || 0;
      });

      item.divisionCompleted = true;
      delete state.divisionEdits[itemId];
      saveData();
      render();
    }

    function editDivision(boothId, itemId) {
      const item = state.events[state.settleEventId].booths[boothId].items[itemId];
      item.divisionCompleted = false;
      state.divisionEdits[itemId] = {};
      state.members.forEach(m => {
        state.divisionEdits[itemId][m] = (item.orders && item.orders[m] && item.orders[m].bought) || 0;
      });
      state.settleDivisionSubTab = 'pending';
      saveData();
    }

    function selectSettleEvent(evId) { state.settleEventId = evId; render(); }

    // ------------------------------------------
    // 成員明細彈窗（與分帳結算及成員庫共用邏輯，支援活動內通販待購商品）
    // ------------------------------------------
    function openMemberDetailModal(memberName, evId) {
      currentOpenMemberModal = { memberName, evId };
      const ev = state.events[evId];
      if (!ev) return;
      const isEditing = !!state.editingMemberDetails[memberName];
      const eventRunners = (state.runnersByEvent && state.runnersByEvent[evId]) || [];

      const memberItems = [];
      const pendingOrMissedItems = []; // 待通販或下次場販商品 (req > bought 且未被放棄)
      let totalPlan = 0, totalBought = 0;
      const sashiireList = [];
      const memberOweRunnerMap = {};
      eventRunners.forEach(r => { memberOweRunnerMap[r] = 0; });

      Object.values(ev.booths || {}).forEach(b => {
        const authors = getBoothAuthors(b);
        authors.forEach((auth, aIdx) => {
          if ((auth.sashiire || []).includes(memberName)) {
            const given = !!(auth.sashiireGiven && auth.sashiireGiven[memberName]);
            sashiireList.push({
              boothId: b.id,
              authorIdx: aIdx,
              authorName: auth.name || '未命名作者',
              boothCode: b.code,
              circle: b.circle,
              given
            });
          }
        });

        Object.values(b.items || {}).forEach(it => {
          const ord = it.orders && it.orders[memberName];
          if (ord && (ord.req > 0 || ord.bought > 0)) {
            totalPlan += ord.req * it.price;
            totalBought += ord.bought * it.price;
            memberItems.push({
              boothId: b.id, itemId: it.id, boothCode: b.code, circle: b.circle,
              itemName: it.name, price: it.price, req: ord.req, bought: ord.bought, status: it.status, itemImage: it.itemImage
            });

            // 檢查是否沒買齊或售空沒買到 (未買齊且status不為skip)
            if (it.status !== 'skip' && ord.bought < ord.req) {
              pendingOrMissedItems.push({
                boothId: b.id, itemId: it.id, boothCode: b.code, circle: b.circle,
                itemName: it.name, price: it.price, req: ord.req, bought: ord.bought,
                tsuhanBought: ord.tsuhanBought || 0, status: it.status, itemImage: it.itemImage
              });
            }

            if (ord.bought > 0) {
              const pBy = it.purchasedBy || {};
              const totalRunnerBought = Object.values(pBy).reduce((s, c) => s + c, 0);
              if (totalRunnerBought > 0) {
                Object.entries(pBy).forEach(([rName, rCnt]) => {
                  if (memberOweRunnerMap[rName] !== undefined) {
                    const proportion = (rCnt / totalRunnerBought) * (ord.bought * it.price);
                    memberOweRunnerMap[rName] += proportion;
                  }
                });
              } else if (eventRunners.length > 0) {
                const share = (ord.bought * it.price) / eventRunners.length;
                eventRunners.forEach(r => { memberOweRunnerMap[r] += share; });
              }
            }
          }
        });
      });

      sashiireList.sort((a, b) => (a.given === b.given ? 0 : a.given ? 1 : -1));

      showModal(`
        <div class="flex justify-between items-center mb-3 pb-2 border-b">
          <div>
            <h3 class="font-bold text-base text-gray-800">${memberName} · ${ev.name}</h3>
            <p class="text-xs text-gray-400">希望商品、通販待購與 差し入れ 明細</p>
          </div>
          <div class="flex items-center gap-2">
            <button onclick="toggleMemberDetailEdit('${memberName}')" class="px-2.5 py-1 rounded bg-[#4A7C6F]/15 text-[#4A7C6F] text-xs font-bold">
              ${isEditing ? '完成編輯' : '編輯'}
            </button>
            <button onclick="closeMemberDetailModal()" class="text-gray-400 text-lg">&times;</button>
          </div>
        </div>

        <div class="space-y-2 mb-3 bg-gray-50 p-3 rounded-xl text-xs">
          <div class="flex justify-between items-center">
            <div>
              預算: <span class="font-bold text-gray-700">${formatCurrency(totalPlan, evId)}</span> | 
              應付: <span class="font-bold text-[#D96B43]">${formatCurrency(totalBought, evId)}</span>
            </div>
            <div class="flex gap-1 bg-white p-0.5 rounded border">
              <button onclick="setSettleImageMode('small')" class="px-2 py-0.5 rounded text-[10px] ${state.settleImageMode === 'small' ? 'bg-[#4A7C6F] text-white font-bold' : 'text-gray-600'}">小圖</button>
              <button onclick="setSettleImageMode('large')" class="px-2 py-0.5 rounded text-[10px] ${state.settleImageMode === 'large' ? 'bg-[#4A7C6F] text-white font-bold' : 'text-gray-600'}">大圖</button>
              <button onclick="setSettleImageMode('list')" class="px-2 py-0.5 rounded text-[10px] ${state.settleImageMode === 'list' ? 'bg-[#4A7C6F] text-white font-bold' : 'text-gray-600'}">列表</button>
            </div>
          </div>

          <div class="pt-2 border-t border-gray-200">
            <div class="font-bold text-gray-700 mb-1"><i class="fa-solid fa-coins mr-1 text-[#4A7C6F]"></i>需給回各跑攤人的金額：</div>
            <div class="flex flex-wrap gap-2">
              ${eventRunners.length === 0 ? '<span class="text-gray-400">尚無跑攤人資料</span>' : eventRunners.map(r => `
                <span class="bg-white px-2 py-1 rounded border border-gray-200 font-bold text-gray-800">
                  ${r}: <span class="text-[#D96B43]">${formatCurrency(Math.round(memberOweRunnerMap[r] || 0), evId)}</span>
                </span>
              `).join('')}
            </div>
          </div>
        </div>

        <div class="space-y-4 max-h-[60vh] overflow-y-auto pr-1">
          <!-- 待通販或下次場販商品列表 (可摺疊) -->
          <details class="bg-indigo-50/70 rounded-xl border border-indigo-200 overflow-hidden" open>
            <summary class="p-3 text-xs font-bold text-indigo-900 cursor-pointer select-none flex justify-between items-center bg-indigo-100/60">
              <span><i class="fa-solid fa-bag-shopping mr-1"></i>待通販或下次場販商品列表 (${pendingOrMissedItems.length})</span>
              <i class="fa-solid fa-chevron-down text-[10px]"></i>
            </summary>
            <div class="p-3 space-y-2 bg-white">
              ${pendingOrMissedItems.length === 0 ? '<div class="text-xs text-gray-400 text-center py-2">太棒了！所有商品皆已順利買齊！</div>' : pendingOrMissedItems.map(item => `
                <div class="bg-gray-50 p-2.5 rounded-lg border space-y-1">
                  <div class="flex justify-between items-center">
                    <div class="text-xs font-bold text-[#4A7C6F]">${item.boothCode} ${item.circle}</div>
                    <span class="text-[10px] bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">${item.status === 'soldout' ? '場販售空' : '未買齊'}</span>
                  </div>
                  <div class="text-xs font-medium text-gray-800">${item.itemName} (需求 ${item.req} / 已買 ${item.bought})</div>
                  <div class="flex justify-between items-center pt-1 text-xs">
                    <span class="text-gray-500">在通販買到數量：</span>
                    <div class="flex items-center gap-1.5 bg-white px-2 py-1 rounded border">
                      <button onclick="updateTsuhanQty('${evId}', '${item.boothId}', '${item.itemId}', '${memberName}', -1)" class="w-5 h-5 rounded bg-gray-100 font-bold text-xs">-</button>
                      <span class="font-bold w-6 text-center text-[#4A7C6F]">${item.tsuhanBought}</span>
                      <button onclick="updateTsuhanQty('${evId}', '${item.boothId}', '${item.itemId}', '${memberName}', 1)" class="w-5 h-5 rounded bg-[#4A7C6F]/15 font-bold text-xs text-[#4A7C6F]">+</button>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          </details>

          ${sashiireList.length > 0 ? `
            <details class="bg-amber-50/70 rounded-xl border border-amber-200 overflow-hidden" open>
              <summary class="p-3 text-xs font-bold text-amber-900 cursor-pointer select-none flex justify-between items-center bg-amber-100/60">
                <span><i class="fa-solid fa-gift mr-1"></i>${memberName} 的 差し入れ 清單 (${sashiireList.filter(s => s.given).length}/${sashiireList.length} 已給)</span>
                <i class="fa-solid fa-chevron-down text-[10px]"></i>
              </summary>
              <div class="p-3 space-y-1.5 bg-white">
                ${sashiireList.map(s => `
                  <div class="flex justify-between items-center px-3 py-2 rounded-lg border transition ${s.given ? 'bg-gray-100 border-gray-200 opacity-50 grayscale' : 'bg-white border-amber-200 shadow-sm'}">
                    <div class="flex items-center gap-2">
                      ${isEditing ? `
                        <input type="checkbox" ${s.given ? 'checked' : ''} onchange="toggleMemberDetailSashiire('${evId}', '${s.boothId}', ${s.authorIdx}, '${memberName}', this.checked)" class="w-4 h-4 accent-[#4A7C6F]" />
                      ` : ''}
                      <div>
                        <span class="font-bold text-xs text-gray-800 ${s.given ? 'line-through' : ''}">${s.authorName}</span>
                        <span class="text-[11px] text-[#4A7C6F] font-bold ml-1.5">(${s.boothCode})</span>
                      </div>
                    </div>
                    <span class="text-[10px] font-bold px-2 py-0.5 rounded ${s.given ? 'bg-gray-200 text-gray-500' : 'bg-amber-100 text-amber-800'}">
                      ${s.given ? '已給' : '還沒給'}
                    </span>
                  </div>
                `).join('')}
              </div>
            </details>
          ` : ''}

          <div class="space-y-2.5">
            ${memberItems.length === 0 ? '<div class="text-center text-xs text-gray-400 py-6">此成員在此活動中無登記任何商品</div>' : memberItems.map(item => {
              const imgClass = state.settleImageMode === 'large' ? 'w-20 h-20' : 'w-10 h-10';
              const showImg = state.settleImageMode !== 'list';
              return `
                <div class="bg-[#F9FAF8] p-3 rounded-xl border border-gray-100 flex items-center justify-between">
                  <div class="flex items-center gap-2.5">
                    ${showImg && item.itemImage ? `<img src="${item.itemImage}" class="${imgClass} object-cover rounded border shrink-0 transition-all" />` : showImg ? '<div class="w-10 h-10 bg-gray-200 rounded flex items-center justify-center text-[10px] text-gray-400 shrink-0">無圖</div>' : ''}
                    <div>
                      <div class="text-xs font-bold text-[#4A7C6F]">${item.boothCode} ${item.circle}</div>
                      <div class="text-sm font-medium text-gray-800">${item.itemName}</div>
                      <div class="text-xs text-gray-500 mt-0.5">
                        單價 ${formatCurrency(item.price, evId)} · 
                        ${isEditing ? `
                          需求 <input type="number" min="0" value="${item.req}" onchange="updateMemberReqLive('${evId}', '${item.boothId}', '${item.itemId}', '${memberName}', this.value)" class="w-14 border rounded px-1 py-0.5 text-center font-bold text-xs" /> 本
                        ` : `
                          需求 <span class="font-bold text-gray-800">${item.req}</span> 本
                        `}
                        / 已買 <span class="font-bold text-[#4A7C6F]">${item.bought}</span> 本
                      </div>
                    </div>
                  </div>
                  <div class="text-right shrink-0">
                    <div class="text-xs font-bold text-[#D96B43]">${formatCurrency(item.bought * item.price, evId)}</div>
                    <div class="text-[10px] text-gray-400">${item.status === 'done' ? '已買齊' : item.status === 'soldout' ? '售空' : item.status === 'skip' ? '已放棄' : '待購'}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `);
    }

    function updateTsuhanQty(evId, boothId, itemId, memberName, delta) {
      const ev = state.events[evId];
      if (!ev || !ev.booths[boothId] || !ev.booths[boothId].items[itemId]) return;
      const it = ev.booths[boothId].items[itemId];
      if (!it.orders[memberName]) it.orders[memberName] = { req: 0, bought: 0, tsuhanBought: 0 };
      const cur = it.orders[memberName].tsuhanBought || 0;
      it.orders[memberName].tsuhanBought = Math.max(0, cur + delta);
      saveData();
      openMemberDetailModal(memberName, evId);
    }

    function toggleMemberDetailSashiire(evId, boothId, authorIdx, memberName, isChecked) {
      const ev = state.events[evId];
      if (!ev || !ev.booths[boothId]) return;
      const authors = getBoothAuthors(ev.booths[boothId]);
      if (authors[authorIdx]) {
        if (!authors[authorIdx].sashiireGiven) authors[authorIdx].sashiireGiven = {};
        authors[authorIdx].sashiireGiven[memberName] = isChecked;
        ev.booths[boothId].authors = authors;
        saveData();
        openMemberDetailModal(memberName, evId);
      }
    }

    function closeMemberDetailModal() { currentOpenMemberModal = null; closeModal(); }
    function toggleMemberDetailEdit(memberName) {
      state.editingMemberDetails[memberName] = !state.editingMemberDetails[memberName];
      if (currentOpenMemberModal) openMemberDetailModal(memberName, currentOpenMemberModal.evId);
    }
    function updateMemberReqLive(evId, boothId, itemId, memberName, val) {
      const req = parseInt(val) || 0;
      const ev = state.events[evId];
      if (ev && ev.booths[boothId] && ev.booths[boothId].items[itemId]) {
        const item = ev.booths[boothId].items[itemId];
        if (!item.orders[memberName]) item.orders[memberName] = { req: 0, bought: 0 };
        item.orders[memberName].req = req;
        saveData();
      }
    }
    function setSettleImageMode(mode) {
      state.settleImageMode = mode;
      saveData();
      if (currentOpenMemberModal) openMemberDetailModal(currentOpenMemberModal.memberName, currentOpenMemberModal.evId);
      else render();
    }

    // ------------------------------------------
    // 分頁 4：「商品．作者與成員庫」 (升級版常用作者頁面)
    // ------------------------------------------
    function renderFavoritesTab(container) {
      const subTab = state.librarySubTab || 'items';
      const search = (state.librarySearch || '').trim().toLowerCase();
      const filterEv = state.libraryFilterEvent || 'all';
      const filterTag = state.libraryFilterTag || 'all';

      const evList = getSortedEvents();
      const allTags = getTopTags();

      let html = `
        <div class="card p-4 mb-3">
          <div class="flex justify-between items-center mb-3">
            <div>
              <div class="font-bold text-base">商品、作者與成員庫</div>
              <div class="text-xs text-gray-400">整合所有活動的商品、作者與成員資訊，支援搜尋、篩選與加入活動</div>
            </div>
            <button onclick="openNewFavModal()" class="btn-primary px-3 py-1.5 rounded-xl text-xs font-bold shrink-0">+ 收藏作者</button>
          </div>

          <!-- 分頁切換 -->
          <div class="flex bg-gray-100 p-1 rounded-xl text-xs mb-3">
            <button onclick="setLibrarySubTab('items')" class="flex-1 py-1.5 rounded-lg font-bold transition ${subTab === 'items' ? 'bg-[#4A7C6F] text-white shadow-sm' : 'text-gray-600'}">商品庫</button>
            <button onclick="setLibrarySubTab('authors')" class="flex-1 py-1.5 rounded-lg font-bold transition ${subTab === 'authors' ? 'bg-[#4A7C6F] text-white shadow-sm' : 'text-gray-600'}">作者庫</button>
            <button onclick="setLibrarySubTab('members')" class="flex-1 py-1.5 rounded-lg font-bold transition ${subTab === 'members' ? 'bg-[#4A7C6F] text-white shadow-sm' : 'text-gray-600'}">成員庫</button>
          </div>

          <!-- 搜尋與篩選列 -->
          ${subTab !== 'members' ? `
            <div class="space-y-2">
              <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
                <input type="text" value="${state.librarySearch || ''}" oninput="setLibrarySearch(this.value)" placeholder="${subTab === 'items' ? '搜尋商品名稱...' : '搜尋作者或社團名稱...'}" class="w-full border rounded-xl pl-8 pr-3 py-1.5 text-xs bg-gray-50" />
              </div>
              <div class="flex gap-2 overflow-x-auto no-scrollbar py-1 text-xs items-center">
                <select onchange="setLibraryFilterEvent(this.value)" class="border rounded-lg px-2 py-1 bg-white text-gray-700 font-bold shrink-0">
                  <option value="all" ${filterEv === 'all' ? 'selected' : ''}>所有活動</option>
                  ${evList.map(ev => `<option value="${ev.id}" ${filterEv === ev.id ? 'selected' : ''}>${ev.name}</option>`).join('')}
                </select>
                ${subTab === 'items' ? `
                  <select onchange="setLibraryFilterTag(this.value)" class="border rounded-lg px-2 py-1 bg-white text-gray-700 font-bold shrink-0">
                    <option value="all" ${filterTag === 'all' ? 'selected' : ''}>所有標籤</option>
                    ${allTags.map(t => `<option value="${t}" ${filterTag === t ? 'selected' : ''}>#${t}</option>`).join('')}
                  </select>
                ` : ''}
              </div>
            </div>
          ` : `
            <div class="relative">
              <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-xs"></i>
              <input type="text" value="${state.librarySearch || ''}" oninput="setLibrarySearch(this.value)" placeholder="搜尋成員名稱..." class="w-full border rounded-xl pl-8 pr-3 py-1.5 text-xs bg-gray-50" />
            </div>
          `}
        </div>
      `;

      if (subTab === 'items') {
        // 收集所有活動商品
        let allItemsList = [];
        Object.values(state.events || {}).forEach(ev => {
          if (filterEv !== 'all' && ev.id !== filterEv) return;
          Object.values(ev.booths || {}).forEach(b => {
            Object.values(b.items || {}).forEach(it => {
              const tags = Array.isArray(it.tags) ? it.tags : [];
              if (filterTag !== 'all' && !tags.includes(filterTag)) return;

              const itemName = (it.name || '').toLowerCase();
              const authorsStr = getItemAuthors(it).join(' ').toLowerCase();
              if (search && !itemName.includes(search) && !authorsStr.includes(search)) return;

              // 統計成功得到多少數量的成員
              const memberGetSummary = [];
              state.members.forEach(m => {
                const bgt = (it.orders && it.orders[m] && it.orders[m].bought) || 0;
                if (bgt > 0) memberGetSummary.push(`${m}×${bgt}`);
              });

              allItemsList.push({
                evId: ev.id,
                evName: ev.name,
                boothId: b.id,
                boothCode: b.code,
                circle: b.circle,
                item: it,
                authors: getItemAuthors(it),
                memberGetSummary
              });
            });
          });
        });

        html += `<div class="space-y-3">`;
        if (allItemsList.length === 0) {
          html += `<div class="card p-8 text-center text-gray-400 text-xs">沒有找到符合條件的商品</div>`;
        } else {
          allItemsList.forEach(entry => {
            const it = entry.item;
            const tags = Array.isArray(it.tags) ? it.tags : [];
            html += `
              <div class="card p-3.5 space-y-2 border border-gray-100">
                <div class="flex justify-between items-start">
                  <div class="flex items-center gap-2.5">
                    ${it.itemImage ? `<img src="${it.itemImage}" class="w-12 h-12 object-cover rounded-lg border shrink-0" />` : '<div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center text-[10px] text-gray-400 shrink-0">無圖</div>'}
                    <div>
                      <div class="text-xs font-bold text-[#4A7C6F]">${entry.evName} · ${entry.boothCode} ${entry.circle}</div>
                      <div class="text-sm font-medium text-gray-800">${it.name}</div>
                      <div class="text-xs text-[#D96B43] font-bold mt-0.5">${formatCurrency(it.price, entry.evId)}</div>
                    </div>
                  </div>
                  <button onclick="openAddToEventModal('item', '${entry.evId}', '${entry.boothId}', '${it.id}')" class="btn-primary px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 shadow-sm">
                    + 加入活動
                  </button>
                </div>
                <div class="flex justify-between items-center text-[11px] text-gray-500 pt-1 border-t border-gray-100">
                  <span>創作者: ${entry.authors.join('、') || '無'}</span>
                  <span>得獎/購買: ${entry.memberGetSummary.join('、') || '尚無'}</span>
                </div>
              </div>
            `;
          });
        }
        html += `</div>`;

      } else if (subTab === 'authors') {
        // 作者庫
        let authorMap = {};
        Object.values(state.events || {}).forEach(ev => {
          if (filterEv !== 'all' && ev.id !== filterEv) return;
          Object.values(ev.booths || {}).forEach(b => {
            getBoothAuthors(b).forEach(a => {
              if (!a.name) return;
              if (search && !a.name.toLowerCase().includes(search) && !b.circle.toLowerCase().includes(search)) return;

              if (!authorMap[a.name]) {
                authorMap[a.name] = { name: a.name, links: a.links || [], events: new Set(), items: [] };
              }
              authorMap[a.name].events.add(ev.name);
              // 收集該作者出品的商品
              Object.values(b.items || {}).forEach(it => {
                const itsAuth = getItemAuthors(it);
                if (itsAuth.length === 0 || itsAuth.includes(a.name)) {
                  authorMap[a.name].items.push({ name: it.name, price: it.price, evName: ev.name, circle: b.circle });
                }
              });
            });
          });
        });

        // 加上 state.favorites
        (state.favorites || []).forEach(f => {
          if (!f.author) return;
          if (search && !f.author.toLowerCase().includes(search) && !f.circle.toLowerCase().includes(search)) return;
          if (!authorMap[f.author]) {
            authorMap[f.author] = { name: f.author, links: f.link ? [f.link] : [], events: new Set(['常用收藏']), items: [] };
          }
        });

        const authorsList = Object.values(authorMap);

        html += `<div class="space-y-3">`;
        if (authorsList.length === 0) {
          html += `<div class="card p-8 text-center text-gray-400 text-xs">沒有找到符合條件的作者</div>`;
        } else {
          authorsList.forEach(auth => {
            const evsArr = Array.from(auth.events);
            html += `
              <div class="card p-4 space-y-2.5 border border-gray-100">
                <div class="flex justify-between items-start">
                  <div>
                    <div class="font-bold text-base text-gray-800">${auth.name}</div>
                    <div class="text-xs text-gray-400 mt-0.5">出現活動：${evsArr.join('、')}</div>
                  </div>
                  <button onclick="openAddToEventModal('author', '', '', '', '${auth.name.replace(/'/g, "\\'")}')" class="btn-primary px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 shadow-sm">
                    + 加入活動
                  </button>
                </div>
                ${auth.items.length > 0 ? `
                  <div class="bg-gray-50 p-2.5 rounded-xl border space-y-1">
                    <div class="text-[11px] font-bold text-gray-600">出品商品紀錄：</div>
                    <div class="space-y-1">
                      ${auth.items.slice(0, 5).map(it => `
                        <div class="flex justify-between text-xs bg-white px-2 py-1 rounded border">
                          <span class="font-medium text-gray-800">${it.name}</span>
                          <span class="text-[#D96B43] font-bold">¥${it.price} <span class="text-[10px] text-gray-400">(${it.evName})</span></span>
                        </div>
                      `).join('')}
                      ${auth.items.length > 5 ? `<div class="text-[10px] text-gray-400 text-center">...等共 ${auth.items.length} 件商品</div>` : ''}
                    </div>
                  </div>
                ` : ''}
              </div>
            `;
          });
        }
        html += `</div>`;

      } else if (subTab === 'members') {
        // 成員庫
        const filteredMembers = state.members.filter(m => !search || m.toLowerCase().includes(search));

        html += `<div class="space-y-3">`;
        if (filteredMembers.length === 0) {
          html += `<div class="card p-8 text-center text-gray-400 text-xs">沒有找到符合條件的成員</div>`;
        } else {
          filteredMembers.forEach(m => {
            html += `
              <div class="card p-4 flex justify-between items-center cursor-pointer hover:bg-gray-50 transition" onclick="openLibMemberDetailModal('${m}')">
                <div class="flex items-center gap-2.5">
                  <span class="w-8 h-8 rounded-full bg-[#4A7C6F] text-white text-xs font-bold flex items-center justify-center">${m[0]}</span>
                  <div>
                    <div class="font-bold text-base text-gray-800">${m}</div>
                    <div class="text-xs text-gray-400 mt-0.5">點擊查看跨活動所有商品、通販待購與明細</div>
                  </div>
                </div>
                <span class="text-xs text-[#4A7C6F] font-bold bg-[#4A7C6F]/10 px-3 py-1.5 rounded-xl">查看明細 <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
              </div>
            `;
          });
        }
        html += `</div>`;
      }

      container.innerHTML = html;
    }

    function setLibrarySubTab(tab) { state.librarySubTab = tab; state.librarySearch = ''; render(); }
    function setLibrarySearch(val) { state.librarySearch = val; render(); }
    function setLibraryFilterEvent(val) { state.libraryFilterEvent = val; render(); }
    function setLibraryFilterTag(val) { state.libraryFilterTag = val; render(); }

    // ------------------------------------------
    // 「加入活動」功能彈窗邏輯
    // ------------------------------------------
    function openAddToEventModal(type, srcEvId, srcBoothId, srcItemId, authorName = '') {
      const evList = getSortedEvents();
      if (evList.length === 0) return alert('請先建立展會活動！');

      let targetEvId = state.activeEventId || evList[0].id;
      let targetBoothAction = 'existing'; // 'existing' or 'new'
      let selectedBoothId = '';
      let pastWorksForAuthor = [];

      if (type === 'author') {
        // 收集該作者過往商品
        Object.values(state.events || {}).forEach(ev => {
          Object.values(ev.booths || {}).forEach(b => {
            const bAuths = getBoothAuthors(b).map(a => a.name);
            Object.values(b.items || {}).forEach(it => {
              if (bAuths.includes(authorName)) {
                pastWorksForAuthor.push({ name: it.name, price: it.price, links: getItemLinks(it), tags: it.tags || [], itemImage: it.itemImage || '' });
              }
            });
          });
        });
      }

      window.renderAddToEventModalContent = () => {
        const ev = state.events[targetEvId];
        const booths = ev && ev.booths ? Object.values(ev.booths) : [];

        showModal(`
          <div class="flex justify-between items-center mb-3">
            <h3 class="font-bold text-base text-gray-800"><i class="fa-solid fa-circle-plus text-[#4A7C6F] mr-1.5"></i>將${type === 'item' ? '商品' : '作者'}加入活動</h3>
            <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
          </div>
          <div class="space-y-3 max-h-[75vh] overflow-y-auto pr-1">
            <div>
              <label class="text-xs font-bold text-gray-700 block mb-1">1. 選擇目標活動：</label>
              <select onchange="updateTargetEv(this.value)" class="w-full border rounded-xl px-3 py-2 text-sm bg-gray-50 font-bold">
                ${evList.map(e => `<option value="${e.id}" ${e.id === targetEvId ? 'selected' : ''}>${e.name} (${e.hall || '主展館'})</option>`).join('')}
              </select>
            </div>

            <div>
              <label class="text-xs font-bold text-gray-700 block mb-1">2. 選擇加入現有攤位或新增攤位：</label>
              <div class="flex gap-2 mb-2">
                <button type="button" onclick="setBoothAction('existing')" class="flex-1 py-1.5 rounded-lg text-xs font-bold border ${targetBoothAction === 'existing' ? 'bg-[#4A7C6F] text-white border-[#4A7C6F]' : 'bg-white text-gray-700'}">選擇現有攤位</button>
                <button type="button" onclick="setBoothAction('new')" class="flex-1 py-1.5 rounded-lg text-xs font-bold border ${targetBoothAction === 'new' ? 'bg-[#4A7C6F] text-white border-[#4A7C6F]' : 'bg-white text-gray-700'}">新增新攤位</button>
              </div>

              ${targetBoothAction === 'existing' ? `
                <div class="space-y-1.5">
                  <input id="booth-quick-search" type="text" placeholder="搜尋攤位編號或社團名稱加速選擇..." oninput="filterBoothListInModal(this.value)" class="w-full border rounded-xl px-3 py-2 text-xs" />
                  <div id="booth-select-container" class="space-y-1.5 max-h-40 overflow-y-auto border rounded-xl p-2 bg-gray-50">
                    ${booths.length === 0 ? '<div class="text-xs text-gray-400 text-center py-2">此活動尚無攤位，請切換為新增攤位</div>' : booths.map(b => `
                      <label class="flex items-center gap-2 p-2 rounded-lg bg-white border cursor-pointer hover:bg-emerald-50 booth-option-label" data-text="${(b.code + ' ' + b.circle).toLowerCase()}">
                        <input type="radio" name="target_booth_radio" value="${b.id}" ${selectedBoothId === b.id || (!selectedBoothId && booths[0].id === b.id) ? 'checked' : ''} onchange="selectedBoothId='${b.id}'" class="accent-[#4A7C6F]" />
                        <span class="font-bold text-xs">${b.code} - ${b.circle}</span>
                      </label>
                    `).join('')}
                  </div>
                </div>
              ` : `
                <div class="bg-gray-50 p-3 rounded-xl border space-y-2">
                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="text-[10px] text-gray-500">新攤位編號 *</label>
                      <input id="new-added-booth-code" type="text" placeholder="例: A-12" class="w-full border rounded px-2.5 py-1.5 text-xs font-bold" />
                    </div>
                    <div>
                      <label class="text-[10px] text-gray-500">社團名稱 *</label>
                      <input id="new-added-booth-circle" type="text" placeholder="社團名" value="${type === 'author' ? authorName : ''}" class="w-full border rounded px-2.5 py-1.5 text-xs font-bold" />
                    </div>
                  </div>
                </div>
              `}
            </div>

            ${type === 'author' ? `
              <div class="bg-amber-50/70 p-3 rounded-xl border border-amber-200 space-y-2">
                <label class="text-xs font-bold text-amber-900 block">3. 勾選該作者的過往商品一併加入：</label>
                <div class="space-y-1.5 max-h-40 overflow-y-auto bg-white p-2 rounded-lg border">
                  ${pastWorksForAuthor.length === 0 ? '<div class="text-xs text-gray-400 text-center py-2">無過往商品紀錄</div>' : pastWorksForAuthor.map((p, idx) => `
                    <label class="flex items-center gap-2 text-xs cursor-pointer hover:bg-gray-50 p-1 rounded">
                      <input type="checkbox" class="author-past-work-chk w-3.5 h-3.5 accent-[#4A7C6F]" data-idx="${idx}" checked />
                      <span class="font-bold text-gray-800">${p.name}</span>
                      <span class="text-[#D96B43]">¥${p.price}</span>
                    </label>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <button type="button" onclick="confirmAddToEvent('${type}', '${srcEvId}', '${srcBoothId}', '${srcItemId}', '${authorName.replace(/'/g, "\\'")}')" class="w-full btn-primary py-2.5 rounded-xl text-sm font-bold shadow-sm mt-2">
              確認加入活動
            </button>
          </div>
        `);
      };

      window.updateTargetEv = (evId) => { targetEvId = evId; window.renderAddToEventModalContent(); };
      window.setBoothAction = (action) => { targetBoothAction = action; window.renderAddToEventModalContent(); };
      window.filterBoothListInModal = (val) => {
        const query = val.toLowerCase();
        document.querySelectorAll('.booth-option-label').forEach(lbl => {
          const txt = lbl.dataset.text || '';
          if (txt.includes(query)) lbl.style.display = 'flex';
          else lbl.style.display = 'none';
        });
      };

      window.confirmAddToEvent = (t, sEvId, sBoothId, sItemId, aName) => {
        const targetEv = state.events[targetEvId];
        if (!targetEv) return alert('請選擇有效的目標活動');

        let destBoothId = selectedBoothId;
        if (targetBoothAction === 'new') {
          const bCode = document.getElementById('new-added-booth-code').value.trim();
          const bCircle = document.getElementById('new-added-booth-circle').value.trim();
          if (!bCode || !bCircle) return alert('請填寫新攤位編號與社團名稱');
          
          destBoothId = 'b_' + Date.now();
          if (!targetEv.booths) targetEv.booths = {};
          const order = Object.keys(targetEv.booths).length + 1;

          let boothAuthors = [{ name: t === 'author' ? aName : '作者', links: [], sashiire: [], sashiireGiven: {} }];
          if (t === 'item') {
            const srcIt = state.events[sEvId]?.booths[sBoothId]?.items[sItemId];
            const srcAuths = srcIt ? getItemAuthors(srcIt) : [];
            if (srcAuths.length > 0) boothAuthors = srcAuths.map(an => ({ name: an, links: [], sashiire: [], sashiireGiven: {} }));
          }

          targetEv.booths[destBoothId] = {
            id: destBoothId, code: bCode, circle: bCircle,
            authors: boothAuthors, boothMapImage: '', flyerImages: [],
            order, x: 50, y: 50, items: {}
          };
        }

        if (!destBoothId && targetBoothAction === 'existing') {
          const firstRadio = document.querySelector('input[name="target_booth_radio"]:checked') || document.querySelector('input[name="target_booth_radio"]');
          if (firstRadio) destBoothId = firstRadio.value;
        }

        if (!targetEv.booths[destBoothId]) return alert('請選擇或建立目標攤位！');
        const destBooth = targetEv.booths[destBoothId];
        if (!destBooth.items) destBooth.items = {};

        if (t === 'item') {
          const srcIt = state.events[sEvId]?.booths[sBoothId]?.items[sItemId];
          if (!srcIt) return alert('來源商品不存在');
          const newId = 'item_' + Date.now();
          const orders = {};
          state.members.forEach(m => { orders[m] = { req: 0, bought: 0 }; });

          destBooth.items[newId] = {
            id: newId,
            name: srcIt.name,
            price: srcIt.price,
            reserve: srcIt.reserve || 0,
            links: [...getItemLinks(srcIt)],
            tags: [...(srcIt.tags || [])],
            authors: [...getItemAuthors(srcIt)],
            status: 'pending',
            itemImage: srcIt.itemImage || '',
            divisionCompleted: false,
            order: Object.keys(destBooth.items).length + 1,
            orders
          };
          alert(`成功將「${srcIt.name}」加入「${targetEv.name}」的攤位 ${destBooth.code}！`);
        } else if (t === 'author') {
          // 將作者加入攤位作者群（若尚未存在）
          const boothAuths = getBoothAuthors(destBooth);
          if (!boothAuths.some(a => a.name === aName)) {
            boothAuths.push({ name: aName, links: [], sashiire: [], sashiireGiven: {} });
            destBooth.authors = boothAuths;
          }

          // 勾選的過往商品
          const chks = document.querySelectorAll('.author-past-work-chk:checked');
          chks.forEach(chk => {
            const p = pastWorksForAuthor[parseInt(chk.dataset.idx)];
            if (!p) return;
            const newId = 'item_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
            const orders = {};
            state.members.forEach(m => { orders[m] = { req: 0, bought: 0 }; });

            destBooth.items[newId] = {
              id: newId,
              name: p.name,
              price: p.price,
              reserve: 0,
              links: [...p.links],
              tags: [...p.tags],
              authors: [aName],
              status: 'pending',
              itemImage: p.itemImage,
              divisionCompleted: false,
              order: Object.keys(destBooth.items).length + 1,
              orders
            };
          });
          alert(`成功將作者「${aName}」與 ${chks.length} 件商品加入「${targetEv.name}」！`);
        }

        closeModal();
        saveData();
        render();
      };

      window.renderAddToEventModalContent();
    }

    // ------------------------------------------
    // 成員庫中點擊某成員的跨活動詳情與待通販列表
    // ------------------------------------------
    function openLibMemberDetailModal(memberName) {
      const evList = getSortedEvents();
      let activeEvId = state.activeEventId || (evList[0] && evList[0].id);

      window.renderLibMemberModal = () => {
        const ev = state.events[activeEvId];
        const eventRunners = (ev && state.runnersByEvent && state.runnersByEvent[ev.id]) || [];

        let totalPlan = 0, totalBought = 0;
        const memberItems = [];
        const pendingOrMissedItems = [];
        const sashiireList = [];

        Object.values(ev.booths || {}).forEach(b => {
          const authors = getBoothAuthors(b);
          authors.forEach((auth, aIdx) => {
            if ((auth.sashiire || []).includes(memberName)) {
              const given = !!(auth.sashiireGiven && auth.sashiireGiven[memberName]);
              sashiireList.push({ boothId: b.id, authorIdx: aIdx, authorName: auth.name || '未命名', boothCode: b.code, circle: b.circle, given });
            }
          });

          Object.values(b.items || {}).forEach(it => {
            const ord = it.orders && it.orders[memberName];
            if (ord && (ord.req > 0 || ord.bought > 0)) {
              totalPlan += ord.req * it.price;
              totalBought += ord.bought * it.price;
              memberItems.push({
                boothId: b.id, itemId: it.id, boothCode: b.code, circle: b.circle,
                itemName: it.name, price: it.price, req: ord.req, bought: ord.bought, status: it.status, itemImage: it.itemImage
              });
              if (it.status !== 'skip' && ord.bought < ord.req) {
                pendingOrMissedItems.push({
                  boothId: b.id, itemId: it.id, boothCode: b.code, circle: b.circle,
                  itemName: it.name, price: it.price, req: ord.req, bought: ord.bought,
                  tsuhanBought: ord.tsuhanBought || 0, status: it.status, itemImage: it.itemImage
                });
              }
            }
          });
        });

        showModal(`
          <div class="flex justify-between items-center mb-3 pb-2 border-b">
            <div>

      if (!authors[authorIdx]) return;
      if (!Array.isArray(authors[authorIdx].sashiire)) authors[authorIdx].sashiire = [];

      if (idx === -1) authors[authorIdx].sashiire.push(memberName);

      if (!name || !name.trim()) return;
      const clean = name.trim();

    function moveItemOrder(boothId, itemId, direction) {
      const booth = state.events[state.activeEventId].booths[boothId];
      const items = getSortedItems(booth);
      const idx = items.findIndex(i => i.id === itemId);
      if (idx === -1) return;
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= items.length) return;

      const moved = items.splice(idx, 1)[0];
      items.splice(targetIdx, 0, moved);
      items.forEach((it, i) => { booth.items[it.id].order = i + 1; });

      saveData();
      render();
    }

    function openSummonWorksModalByAuthor(boothId, authorName) {
      const pastItems = [];
      Object.values(state.events || {}).forEach(ev => {
        Object.values(ev.booths || {}).forEach(b => {
          const bAuthors = getBoothAuthors(b).map(a => a.name).filter(Boolean);
          Object.values(b.items || {}).forEach(it => {
            pastItems.push({
              eventName: ev.name,
              boothCode: b.code,
              circle: b.circle,
              authors: bAuthors,
              name: it.name,
              price: it.price,
              links: getItemLinks(it),
              tags: it.tags || [],
              itemImage: it.itemImage || ''
            });
          });
        });
      });

      const filtered = pastItems.filter(p => p.authors.some(a => a.includes(authorName) || authorName.includes(a)));
      const listToShow = filtered.length > 0 ? filtered : pastItems;

      showModal(`
        <div class="flex justify-between items-center mb-3">
          <div>
            <h3 class="font-bold text-base text-gray-800"><i class="fa-solid fa-wand-magic-sparkles text-amber-600 mr-1"></i>召喚「${authorName}」的過往商品</h3>
            <p class="text-[11px] text-gray-400">勾選要複製帶入此攤位的過往商品</p>
          </div>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>

        <div class="space-y-2 max-h-[55vh] overflow-y-auto pr-1 mb-4">
          ${listToShow.length === 0 ? '<div class="text-center text-xs text-gray-400 py-8">目前資料庫中還沒有歷史商品紀錄</div>' : listToShow.map((p, idx) => `
            <label class="flex items-center gap-2.5 bg-gray-50 p-2.5 rounded-xl border border-gray-200 cursor-pointer hover:bg-emerald-50/40">
              <input type="checkbox" class="summon-work-checkbox w-4 h-4 accent-[#4A7C6F]" data-idx="${idx}" />
              ${p.itemImage ? `<img src="${p.itemImage}" class="w-10 h-10 object-cover rounded border shrink-0" />` : ''}
              <div class="flex-1 min-w-0">
                <div class="text-xs font-bold text-gray-800 truncate">${p.name} <span class="text-[#D96B43] ml-1">¥${p.price}</span></div>
                <div class="text-[10px] text-gray-400 truncate">${p.eventName} · ${p.circle} (${p.authors.join('、')})</div>
              </div>
            </label>
          `).join('')}
        </div>

        <button type="button" id="btn-confirm-summon" class="w-full btn-primary py-2.5 rounded-xl text-sm font-bold shadow-sm">
          確認召喚並加入攤位
        </button>
      `);

      document.getElementById('btn-confirm-summon').onclick = () => {
        const checkedBoxes = document.querySelectorAll('.summon-work-checkbox:checked');
        if (checkedBoxes.length === 0) return closeModal();

        const ev = state.events[state.activeEventId];
        if (!ev || !ev.booths[boothId]) return closeModal();
        if (!ev.booths[boothId].items) ev.booths[boothId].items = {};

        const library = getAllAuthorsLibrary();
        const foundAuth = library.find(a => a.name === authorName);
        if (foundAuth && foundAuth.links && foundAuth.links.length > 0) {
          const authorBlocks = document.querySelectorAll(`.edit-author-block-${boothId}`);
          authorBlocks.forEach(blk => {
            const nameInp = blk.querySelector('.edit-author-name');
            if (nameInp && nameInp.value.trim() === authorName) {
              const linkInp = blk.querySelector('.edit-author-link');
              if (linkInp && !linkInp.value.trim()) linkInp.value = foundAuth.links[0];
            }
          });
        }

        let orderCounter = Object.keys(ev.booths[boothId].items).length + 1;
        checkedBoxes.forEach(cb => {
          const p = listToShow[parseInt(cb.dataset.idx)];
          if (!p) return;
          const newId = 'item_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
          const orders = {};
          state.members.forEach(m => { orders[m] = { req: 0, bought: 0 }; });

          ev.booths[boothId].items[newId] = {
            id: newId,
            name: p.name,
            price: p.price,
            reserve: 0,
            links: [...p.links],
            tags: [...p.tags],
            authors: [authorName],
            order: orderCounter++,
            status: 'pending',
            itemImage: p.itemImage,
            divisionCompleted: false,
            orders
          };
        });

        closeModal();
        saveData();
        render();
      };
    }

    function finishBoothEdit(boothId) {

      if (codeInput && circleInput) {
        const code = codeInput.value.trim();

        if (!code || !circle) return alert('請填寫攤位編號與社團名稱');

        const booth = state.events[state.activeEventId].booths[boothId];
        const prevAuthors = getBoothAuthors(booth);

        const authorBlocks = document.querySelectorAll(`.edit-author-block-${boothId}`);
        const updatedAuthors = Array.from(authorBlocks).map((blk, idx) => {
          const name = blk.querySelector('.edit-author-name').value.trim();
          const links = Array.from(blk.querySelectorAll('.edit-author-link')).map(i => i.value.trim()).filter(Boolean);
          const prev = prevAuthors[idx] || { sashiire: [], sashiireGiven: {} };
          return {
            name,
            links,
            sashiire: prev.sashiire || [],
            sashiireGiven: prev.sashiireGiven || {}
          };
        }).filter(a => a.name);

        const flyers = getBoothFlyers(booth);
        flyers.forEach((f, idx) => {
          const lInp = document.querySelector(`.flyer-link-input-${boothId}-${idx}`);
          if (lInp) f.link = lInp.value.trim();

        booth.code = code;
        booth.circle = circle;
        booth.authors = updatedAuthors;
        booth.flyerImages = flyers;
      }

      state.editingBooths[boothId] = false;
      saveData();
      render();

      const reserveInput = document.getElementById(`edit-it-reserve-${itemId}`);

        const item = state.events[state.activeEventId].booths[boothId].items[itemId];

            if (type.startsWith('image/')) {
              const blob = await clipboardItem.getType(type);
              const reader = new FileReader();
              reader.onload = function(evt) {
                state.events[state.activeEventId].booths[boothId].items[itemId].itemImage = evt.target.result;
                saveData();
                render();
              };
              reader.readAsDataURL(blob);
              return;
            }
          }
        }
        alert('剪貼板中沒有找到圖片');
      } catch (err) { alert('無法讀取剪貼板'); }
    }
