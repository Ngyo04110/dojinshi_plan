    function toggleEditSashiireMember(boothId, authorIdx, memberName) {
      const booth = state.events[state.activeEventId].booths[boothId];
      const authors = getBoothAuthors(booth);
      if (!authors[authorIdx]) return;
      if (!Array.isArray(authors[authorIdx].sashiire)) authors[authorIdx].sashiire = [];
      const idx = authors[authorIdx].sashiire.indexOf(memberName);
      if (idx === -1) authors[authorIdx].sashiire.push(memberName);
      else authors[authorIdx].sashiire.splice(idx, 1);
      booth.authors = authors;
      saveData(); render();
    }

    function quickAddMemberForSashiire(boothId, authorIdx) {
      const name = prompt('請輸入要新增的成員名字：');
      if (!name || !name.trim()) return;
      const clean = name.trim();
      if (!state.members.includes(clean)) state.members.push(clean);
      toggleEditSashiireMember(boothId, authorIdx, clean);
    }

    function moveItemOrder(boothId, itemId, direction) {
      const booth = state.events[state.activeEventId].booths[boothId];
      const items = getSortedItems(booth);
      const idx = items.findIndex(i => i.id === itemId);
      if (idx === -1) return;
      const targetIdx = idx + direction;
      if (targetIdx < 0 || targetIdx >= items.length) return;
      const moved = items.splice(idx, 1)[0];
      items.splice(targetIdx, 0, moved);
      items.forEach((it, i) => { booth.items[it.id].order = i + 1; });
      saveData(); render();
    }

    function triggerSummonForEditingBooth(boothId) {
      const nameInputs = document.querySelectorAll(`.edit-author-block-${boothId} .edit-author-name`);
      const authorNames = Array.from(nameInputs).map(i => i.value.trim()).filter(Boolean);
      if (authorNames.length === 0) {
        alert('請先在攤位資料中填寫至少一位老師／作者姓名，才能召喚該作者的過往商品！');
        return;
      }
      openSummonWorksModalForBooth(boothId, authorNames, false);
    }

    function triggerSummonForNewBooth() {
      const nameInputs = document.querySelectorAll('.new-author-block .new-b-author-name');
      const authorNames = Array.from(nameInputs).map(i => i.value.trim()).filter(Boolean);
      if (authorNames.length === 0) {
        alert('請先填寫至少一位老師／作者姓名，才能召喚該作者的過往商品！');
        return;
      }
      const code = document.getElementById('new-b-code').value.trim();
      const circle = document.getElementById('new-b-circle').value.trim();
      const authorBlocks = document.querySelectorAll('.new-author-block');
      const authors = Array.from(authorBlocks).map((blk) => {
        const name = blk.querySelector('.new-b-author-name').value.trim();
        const links = Array.from(blk.querySelectorAll('.new-b-author-link')).map(i => i.value.trim()).filter(Boolean);
        return { name, links, sashiire: [], sashiireGiven: {} };
      }).filter(a => a.name);

      const flyerItems = document.querySelectorAll('.new-b-flyer-item');
      const flyerImages = [];
      flyerItems.forEach(item => {
        const thumb = item.querySelector('.flyer-thumb-box');
        const linkInp = item.querySelector('.new-b-flyer-link');
        const url = (thumb && thumb.dataset.url) || '';
        const link = (linkInp && linkInp.value.trim()) || '';
        if (url || link) flyerImages.push({ url, link });
      });

      const ev = state.events[state.activeEventId];
      if (!ev.booths) ev.booths = {};
      const newBoothId = 'b_' + Date.now();
      const order = Object.keys(ev.booths).length + 1;

      ev.booths[newBoothId] = {
        id: newBoothId, code, circle, authors,
        boothMapImage: tempNewBoothMapData,
        flyerImages,
        order, x: 50, y: 50, items: {}
      };
      tempNewBoothMapData = '';
      saveData();
      openSummonWorksModalForBooth(newBoothId, authorNames, true);
    }

    function openSummonWorksModalForBooth(boothId, authorNames, isFromNewBooth = false) {
      const pastItems = [];
      Object.values(state.events || {}).forEach(ev => {
        Object.values(ev.booths || {}).forEach(b => {
          if (b.id === boothId) return;
          const bAuthors = getBoothAuthors(b).map(a => a.name).filter(Boolean);
          Object.values(b.items || {}).forEach(it => {
            const itAuthors = getItemAuthors(it);
            const combinedAuthors = [...new Set([...bAuthors, ...itAuthors])];
            pastItems.push({
              eventName: ev.name, boothCode: b.code, circle: b.circle,
              authors: combinedAuthors, name: it.name, price: it.price,
              links: getItemLinks(it), tags: it.tags || [], itemImage: it.itemImage || ''
            });
          });
        });
      });

      const filtered = pastItems.filter(p =>
        p.authors.some(pa => authorNames.some(an => pa.includes(an) || an.includes(pa)))
      );

      showModal(`
        <div class="flex justify-between items-center mb-3">
          <div>
            <h3 class="font-bold text-base text-gray-800"><i class="fa-solid fa-wand-magic-sparkles text-amber-600 mr-1"></i>召喚「${authorNames.join('、')}」的過往商品</h3>
            <p class="text-[11px] text-gray-400">${isFromNewBooth ? '已建立新攤位，請勾選要一併加入的過往商品' : '勾選要複製帶入此攤位的過往商品'}</p>
          </div>
          <button onclick="closeModal(); render();" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div class="space-y-2 max-h-[55vh] overflow-y-auto pr-1 mb-4">
          ${filtered.length === 0 ? `<div class="text-center text-xs text-gray-400 py-8">在歷史資料庫中找不到「${authorNames.join('、')}」的過往商品紀錄</div>` : filtered.map((p, idx) => `
            <label class="flex items-center gap-2.5 bg-gray-50 p-2.5 rounded-xl border border-gray-200 cursor-pointer hover:bg-emerald-50/40">
              <input type="checkbox" class="summon-work-checkbox w-4 h-4 accent-[#4A7C6F]" data-idx="${idx}" checked />
              ${p.itemImage ? renderImgTag(p.itemImage, 'w-10 h-10 object-cover rounded border shrink-0') : ''}
              <div class="flex-1 min-w-0">
                <div class="text-xs font-bold text-gray-800 truncate">${p.name} <span class="text-[#D96B43] ml-1">¥${p.price}</span></div>
                <div class="text-[10px] text-gray-400 truncate">${p.eventName} · ${p.circle || ''} (${p.authors.join('、')})</div>
              </div>
            </label>
          `).join('')}
        </div>
        <button type="button" id="btn-confirm-summon" class="w-full btn-primary py-2.5 rounded-xl text-sm font-bold shadow-sm">確認召喚並加入攤位</button>
      `);

      document.getElementById('btn-confirm-summon').onclick = () => {
        const checkedBoxes = document.querySelectorAll('.summon-work-checkbox:checked');
        if (checkedBoxes.length === 0) { closeModal(); render(); return; }
        const ev = state.events[state.activeEventId];
        if (!ev || !ev.booths[boothId]) { closeModal(); return; }
        if (!ev.booths[boothId].items) ev.booths[boothId].items = {};
        let orderCounter = Object.keys(ev.booths[boothId].items).length + 1;
        checkedBoxes.forEach(cb => {
          const p = filtered[parseInt(cb.dataset.idx)];
          if (!p) return;
          const newId = 'item_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
          const orders = {};
          state.members.forEach(m => { orders[m] = { req: 0, bought: 0 }; });
          const matchedItemAuthors = p.authors.filter(pa => authorNames.some(an => pa.includes(an) || an.includes(pa)));
          ev.booths[boothId].items[newId] = {
            id: newId, name: p.name, price: p.price, reserve: 0,
            links: [...p.links], tags: [...p.tags],
            authors: matchedItemAuthors.length > 0 ? matchedItemAuthors : [...authorNames],
            order: orderCounter++, status: 'pending', itemImage: p.itemImage,
            divisionCompleted: false, orders
          };
        });
        closeModal(); saveData(); render();
      };
    }

    function normalizeHref(url) {
      const clean = (url || '').trim();
      if (!clean) return '';
      return /^https?:\/\//i.test(clean) ? clean : 'https://' + clean;
    }

    function openLinkSelectorModal(title, subtitle, linkEntries) {
      const valid = (linkEntries || []).filter(entry => entry && entry.raw && entry.raw.trim());
      if (valid.length === 0) {
        alert('尚未設定任何有效鏈結。');
        return;
      }
      if (valid.length === 1) {
        window.open(valid[0].href, '_blank', 'noopener,noreferrer');
        return;
      }
      showModal(`
        <div class="flex justify-between items-center mb-3">
          <div>
            <h3 class="font-bold text-base text-gray-800">${title}</h3>
            <p class="text-xs text-gray-400">${subtitle || '共有多個鏈結，請選擇要開啟哪一個網頁'}</p>
          </div>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div class="space-y-2">
          ${valid.map(entry => `
            <a href="${entry.href}" target="_blank" rel="noopener noreferrer" onclick="closeModal()" class="flex items-center justify-between bg-gray-50 hover:bg-[#4A7C6F]/10 border border-gray-200 px-3.5 py-2.5 rounded-xl transition">
              <div class="min-w-0 pr-2">
                <div class="text-xs font-bold text-[#386156]">${entry.label || '連結'}</div>
                <div class="text-xs text-gray-600 truncate">${entry.raw}</div>
              </div>
              <i class="fa-solid fa-arrow-up-right-from-square text-xs text-[#4A7C6F] shrink-0"></i>
            </a>
          `).join('')}
        </div>
      `);
    }

    function openBoothAuthorLinks(boothId) {
      const ev = state.events[state.activeEventId];
      const booth = ev && ev.booths && ev.booths[boothId];
      if (!booth) return;
      const authors = getBoothAuthors(booth);
      const validLinks = [];
      authors.forEach(auth => {
        const aName = auth.name || '未命名老師';
        (auth.links || []).forEach((lnk, idx) => {
          const clean = (lnk || '').trim();
          if (clean) {
            validLinks.push({
              label: `${aName}${ (auth.links || []).filter(Boolean).length > 1 ? ` · 鏈結 ${idx + 1}` : '' }`,
              raw: clean,
              href: normalizeHref(clean)
            });
          }
        });
      });

      const boothTitle = [booth.code, booth.circle].filter(Boolean).join(' · ') || '攤位作者鏈結';
      openLinkSelectorModal(boothTitle, '請選擇要開啟的作者鏈結', validLinks);
    }

    function openItemLinks(boothId, itemId) {
      const ev = state.events[state.activeEventId];
      const booth = ev && ev.booths && ev.booths[boothId];
      const item = booth && booth.items && booth.items[itemId];
      if (!item) return;
      const links = getItemLinks(item);
      const validLinks = links
        .map((lnk, idx) => {
          const clean = (lnk || '').trim();
          return clean ? {
            label: `${item.name} · 連結 ${idx + 1}`,
            raw: clean,
            href: normalizeHref(clean)
          } : null;
        })
        .filter(Boolean);

      openLinkSelectorModal(item.name || '商品鏈結', '請選擇要開啟的商品連結', validLinks);
    }

    function selectEvent(id) { state.activeEventId = id; state.settleEventId = id; render(); }
    function setRunMode(mode) { state.runMode = mode; render(); }
    function toggleBoothEdit(boothId) { state.editingBooths[boothId] = !state.editingBooths[boothId]; render(); }

    async function pasteToInput(btn) {
      try {
        const text = await navigator.clipboard.readText();
        const input = btn.previousElementSibling;
        if (input && input.tagName === 'INPUT') input.value = text;
      } catch (err) { alert('無法讀取剪貼板，請手動貼上'); }
    }

    function addItemLinkInput(itemId) {
      const container = document.getElementById(`item-links-container-${itemId}`);
      if (!container) return;
      const div = document.createElement('div');
      div.className = 'flex gap-1.5 items-center';
      div.innerHTML = `
        <input type="text" value="" placeholder="https://..." class="item-link-input-${itemId} flex-1 border rounded px-2 py-1 text-xs" />
        <button type="button" onclick="pasteToInput(this)" class="px-2 py-0.5 bg-[#4A7C6F]/15 text-[#4A7C6F] rounded text-[10px] font-bold">黏貼</button>
        <button type="button" onclick="removeThisParent(this)" class="text-red-400 px-1"><i class="fa-solid fa-trash text-xs"></i></button>
      `;
      container.appendChild(div);
    }

    function removeThisParent(btn) { btn.parentElement.remove(); }

    function appendTagToInput(inputId, tag) {
      const input = document.getElementById(inputId);
      if (!input) return;
      const current = input.value.split(',').map(s => s.trim()).filter(Boolean);
      if (!current.includes(tag)) {
        current.push(tag);
        input.value = current.join(', ');
      }
    }

    function updateEditBoothMapPreviewImmediate(boothId, rawOrMediaVal) {
      const previewEl = document.getElementById(`edit-b-map-preview-${boothId}`);
      if (!previewEl) return;
      if (!rawOrMediaVal) {
        previewEl.innerHTML = '無圖';
        return;
      }
      const directSrc = rawOrMediaVal.startsWith('data:image/')
        ? rawOrMediaVal
        : (mediaMemoryCache[rawOrMediaVal] || getImageSrc(rawOrMediaVal));
      if (directSrc) {
        previewEl.innerHTML = `<img src="${directSrc}" class="w-full h-full object-cover" alt="攤位圖預覽" />`;
      } else {
        previewEl.innerHTML = renderImgTag(rawOrMediaVal, 'w-full h-full object-cover');
      }
    }

    function finishBoothEdit(boothId) {
      const ev = state.events[state.activeEventId];
      const booth = ev && ev.booths && ev.booths[boothId];
      if (!booth) {
        state.editingBooths[boothId] = false;
        render();
        return;
      }

      const codeInput = document.getElementById(`edit-b-code-${boothId}`);
      const circleInput = document.getElementById(`edit-b-circle-${boothId}`);
      const prevAuthors = getBoothAuthors(booth);

      const authorBlocks = document.querySelectorAll(`.edit-author-block-${boothId}`);
      if (authorBlocks.length > 0) {
        const parsedAuthors = Array.from(authorBlocks).map((blk, idx) => {
          const nameEl = blk.querySelector('.edit-author-name');
          const name = nameEl ? nameEl.value.trim() : '';
          const links = Array.from(blk.querySelectorAll('.edit-author-link')).map(i => i.value.trim()).filter(Boolean);
          const prev = prevAuthors[idx] || { sashiire: [], sashiireGiven: {} };
          return { name, links, sashiire: prev.sashiire || [], sashiireGiven: prev.sashiireGiven || {} };
        }).filter(a => a.name);

        if (parsedAuthors.length === 0) {
          return alert('老師／作者姓名為必填，請至少填寫一位老師姓名！');
        }
        booth.authors = parsedAuthors;
      } else {
        const validPrev = prevAuthors.filter(a => a && a.name && a.name.trim());
        if (validPrev.length === 0) {
          return alert('老師／作者姓名為必填，請至少填寫一位老師姓名！');
        }
      }

      if (codeInput) {
        booth.code = codeInput.value.trim();
      }
      if (circleInput) {
        booth.circle = circleInput.value.trim();
      }

      const flyers = getBoothFlyers(booth);
      flyers.forEach((f, idx) => {
        const lInp = document.querySelector(`.flyer-link-input-${boothId}-${idx}`);
        if (lInp) f.link = lInp.value.trim();
      });
      booth.flyerImages = flyers;

      state.editingBooths[boothId] = false;
      render();

      const boothPath = `events/${state.activeEventId}/booths/${boothId}`;
      saveData(false, boothPath, booth);
    }

    function deleteBooth(boothId) {
      if (!confirm('確定要刪除此攤位及攤位內的所有商品嗎？此操作無法復原！')) return;
      delete state.events[state.activeEventId].booths[boothId];
      state.editingBooths[boothId] = false;
      saveData(); render();
    }

    async function extractCompressedImageFromClipboard(maxWidth = 420, quality = 0.56, maxBytes = 42000) {
      const clipboardItems = await navigator.clipboard.read();
      for (const clipboardItem of clipboardItems) {
        for (const type of clipboardItem.types) {
          if (type.startsWith('image/')) {
            const blob = await clipboardItem.getType(type);
            return await readBlobOrFileAsCompressedDataUrl(blob, maxWidth, quality, maxBytes);
          }
        }
      }
      return null;
    }

      if (extraAuthorEl && extraAuthorEl.value.trim()) {
        extraAuthorEl.value.trim().split(',').map(s => s.trim()).filter(Boolean).forEach(ea => {
          if (!checkedAuthors.includes(ea)) checkedAuthors.push(ea);

    function initCropInteractions() {
      const stage = document.getElementById('crop-stage');
      const box = document.getElementById('crop-box');
      if (!stage || !box) return;
      const handle = box.querySelector('.crop-resize-handle');
      let rect = { x: 50, y: 50, w: 140, h: 140 };
      let mode = null;
      let startX = 0, startY = 0, startRect = null;

      const updateBoxStyle = () => {
        const maxW = stage.clientWidth;
        const maxH = stage.clientHeight;
        rect.w = Math.max(40, Math.min(rect.w, maxW - rect.x));
        rect.h = Math.max(40, Math.min(rect.h, maxH - rect.y));
        rect.x = Math.max(0, Math.min(rect.x, maxW - rect.w));
        rect.y = Math.max(0, Math.min(rect.y, maxH - rect.h));
        box.style.left = rect.x + 'px';
        box.style.top = rect.y + 'px';
        box.style.width = rect.w + 'px';
        box.style.height = rect.h + 'px';
        cropState.rect = { ...rect };
      };
      updateBoxStyle();

      const onDown = (clientX, clientY, isResize) => {
        mode = isResize ? 'resize' : 'move';
        startX = clientX; startY = clientY; startRect = { ...rect };
      };
      const onMove = (clientX, clientY) => {
        if (!mode) return;
        const dx = clientX - startX; const dy = clientY - startY;
        if (mode === 'move') { rect.x = startRect.x + dx; rect.y = startRect.y + dy; }
        else if (mode === 'resize') { rect.w = startRect.w + dx; rect.h = startRect.h + dy; }
        updateBoxStyle();
      };
      const onUp = () => { mode = null; };

      box.onmousedown = (e) => { if (e.target.closest('.crop-resize-handle')) return; e.stopPropagation(); onDown(e.clientX, e.clientY, false); };
      handle.onmousedown = (e) => { e.stopPropagation(); onDown(e.clientX, e.clientY, true); };
      window.addEventListener('mousemove', (e) => { if (mode) onMove(e.clientX, e.clientY); });
      window.addEventListener('mouseup', onUp);

      box.ontouchstart = (e) => { if (e.target.closest('.crop-resize-handle')) return; e.stopPropagation(); onDown(e.touches[0].clientX, e.touches[0].clientY, false); };
      handle.ontouchstart = (e) => { e.stopPropagation(); onDown(e.touches[0].clientX, e.touches[0].clientY, true); };
      window.addEventListener('touchmove', (e) => { if (mode) { onMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); } }, { passive: false });
      window.addEventListener('touchend', onUp);
    }

    async function confirmCroppedImage() {
      const stage = document.getElementById('crop-stage');
      const imgEl = document.getElementById('crop-source-img');
      if (!stage || !imgEl) return;

      const natW = imgEl.naturalWidth || imgEl.width;
      const natH = imgEl.naturalHeight || imgEl.height;
      const stageW = stage.clientWidth;
      const stageH = stage.clientHeight;
      const imgAspect = natW / natH;
      const stageAspect = stageW / stageH;

      let renderW, renderH, offsetX, offsetY;
      if (imgAspect > stageAspect) {
        renderW = stageW; renderH = stageW / imgAspect;
        offsetX = 0; offsetY = (stageH - renderH) / 2;
      } else {
        renderH = stageH; renderW = stageH * imgAspect;
        offsetY = 0; offsetX = (stageW - renderW) / 2;
      }

      const r = cropState.rect;
      const cropLeft = Math.max(0, r.x - offsetX);
      const cropTop = Math.max(0, r.y - offsetY);
      const cropRight = Math.min(renderW, r.x + r.w - offsetX);
      const cropBottom = Math.min(renderH, r.y + r.h - offsetY);
      const actualCropW = Math.max(10, cropRight - cropLeft);
      const actualCropH = Math.max(10, cropBottom - cropTop);

      const scaleX = natW / renderW;
      const scaleY = natH / renderH;
      const srcX = cropLeft * scaleX;
      const srcY = cropTop * scaleY;
      const srcW = actualCropW * scaleX;
      const srcH = actualCropH * scaleY;

      const canvas = document.createElement('canvas');
      const maxOutDim = 420;
      let outW = srcW; let outH = srcH;
      if (outW > maxOutDim || outH > maxOutDim) {
        if (outW > outH) { outH = (outH * maxOutDim) / outW; outW = maxOutDim; }
        else { outW = (outW * maxOutDim) / outH; outH = maxOutDim; }
      }
      canvas.width = Math.max(1, Math.round(outW));
      canvas.height = Math.max(1, Math.round(outH));
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(imgEl, srcX, srcY, srcW, srcH, 0, 0, canvas.width, canvas.height);

      const rawDataUrl = canvas.toDataURL('image/jpeg', 0.62);
      const compressedDataUrl = await extremeCompressDataUrl(rawDataUrl, IMAGE_PRESETS.item.maxWidth, IMAGE_PRESETS.item.quality, IMAGE_PRESETS.item.maxBytes);
      const storedVal = await externalizeLargeImage(compressedDataUrl);
      if (storedVal !== compressedDataUrl) mediaMemoryCache[storedVal] = compressedDataUrl;

      if (cropState.targetItemId) {
        const item = state.events[state.activeEventId].booths[cropState.targetBoothId].items[cropState.targetItemId];
        item.itemImage = storedVal;
        closeModal();
        saveData(false, `events/${state.activeEventId}/booths/${cropState.targetBoothId}/items/${cropState.targetItemId}`, item);
      } else {
        tempNewItemImageData = storedVal;
        const previewEl = document.getElementById('new-item-img-preview');
        if (previewEl) previewEl.innerHTML = renderImgTag(storedVal, 'w-11 h-11 object-cover rounded-lg border shrink-0');
        closeModal();
      }
    }

    function updateBoughtQty(boothId, itemId, member, delta) {
      const item = state.events[state.activeEventId].booths[boothId].items[itemId];
      if (item.divisionCompleted) item.divisionCompleted = false;
      if (!item.orders[member]) item.orders[member] = { req: 0, bought: 0 };
      const prev = item.orders[member].bought || 0;
      const next = Math.max(0, prev + delta);
      const actualDelta = next - prev;
      item.orders[member].bought = next;

      if (actualDelta !== 0) {
        const runner = state.activeRunner && state.activeRunner !== 'all' ? state.activeRunner : null;
        if (runner) {
          if (!item.purchasedBy) item.purchasedBy = {};
          item.purchasedBy[runner] = Math.max(0, (item.purchasedBy[runner] || 0) + actualDelta);
        }
      }

      const totalReq = state.members.reduce((s, m) => s + ((item.orders[m] && item.orders[m].req) || 0), 0);
      const updatedTotal = state.members.reduce((s, m) => s + ((item.orders[m] && item.orders[m].bought) || 0), 0);
      if (totalReq > 0 && updatedTotal >= totalReq && updatedTotal > 0) item.status = 'done';
      else if (item.status === 'done' && updatedTotal < totalReq) item.status = 'pending';

      saveData(false, `events/${state.activeEventId}/booths/${boothId}/items/${itemId}`, item);
    }

    function deleteEvent(evId) {
      if (!confirm('確定要刪除此活動及活動內的所有攤位與商品嗎？此操作無法復原！')) return;
      delete state.events[evId];
      if (state.activeEventId === evId) {
        const remain = Object.keys(state.events);
        state.activeEventId = remain.length > 0 ? remain[0] : null;
      }
      if (state.settleEventId === evId) state.settleEventId = state.activeEventId;
      closeModal(); saveData(); render();

    function createBooth() {
      const code = document.getElementById('new-b-code').value.trim();
      const circle = document.getElementById('new-b-circle').value.trim();
      const authorBlocks = document.querySelectorAll('.new-author-block');
      const authors = Array.from(authorBlocks).map((blk) => {
        const name = blk.querySelector('.new-b-author-name').value.trim();
        const links = Array.from(blk.querySelectorAll('.new-b-author-link')).map(i => i.value.trim()).filter(Boolean);
        return { name, links, sashiire: [], sashiireGiven: {} };
      }).filter(a => a.name);

      if (authors.length === 0) {
        return alert('老師／作者姓名為必填，請至少填寫一位老師姓名！');
      }

      const flyerItems = document.querySelectorAll('.new-b-flyer-item');
      const flyerImages = [];
      flyerItems.forEach(item => {
        const thumb = item.querySelector('.flyer-thumb-box');
        const linkInp = item.querySelector('.new-b-flyer-link');
        const url = (thumb && thumb.dataset.url) || '';
        const link = (linkInp && linkInp.value.trim()) || '';
        if (url || link) flyerImages.push({ url, link });
      });

      const ev = state.events[state.activeEventId];
      if (!ev.booths) ev.booths = {};
      const id = 'b_' + Date.now();
      const order = Object.keys(ev.booths).length + 1;

      ev.booths[id] = {
        id, code, circle, authors,
        boothMapImage: tempNewBoothMapData,
        flyerImages,
        order, x: 50, y: 50, items: {}
      };
      tempNewBoothMapData = '';
      closeModal(); saveData(); render();
    }

        const compressed = await extractCompressedImageFromClipboard(IMAGE_PRESETS.item.maxWidth, IMAGE_PRESETS.item.quality, IMAGE_PRESETS.item.maxBytes);
        if (compressed) {
          const storedVal = await externalizeLargeImage(compressed);
          if (storedVal !== compressed) mediaMemoryCache[storedVal] = compressed;
          tempNewItemImageData = storedVal;
          document.getElementById('new-item-img-preview').innerHTML = renderImgTag(storedVal, 'w-full h-full object-cover');
        } else alert('剪貼板中沒有找到圖片');
      } catch (err) { alert('無法讀取剪貼板圖片'); }
    }

    function createItem(boothId) {
      const name = document.getElementById('new-it-name').value.trim();
      if (!name) return alert('請填寫商品名稱');
      const priceVal = document.getElementById('new-it-price').value.trim();
      const price = priceVal === '' ? 0 : (parseInt(priceVal) || 0);
      const reserve = parseInt(document.getElementById('new-it-reserve').value) || 0;
      const link = document.getElementById('new-it-link').value.trim();
      const tags = document.getElementById('new-it-tags').value.split(',').map(s => s.trim()).filter(Boolean);

      const authors = Array.from(document.querySelectorAll('.new-item-author-chk:checked')).map(cb => cb.value);
      const extraInp = document.getElementById('new-item-extra-author-input');
      if (extraInp && extraInp.value.trim()) {
        extraInp.value.trim().split(',').map(s => s.trim()).filter(Boolean).forEach(ea => {
          if (!authors.includes(ea)) authors.push(ea);
        });
      }

      const orders = {};
      document.querySelectorAll('.new-item-req-input').forEach(inp => {
        const m = inp.dataset.member;
        orders[m] = { req: parseInt(inp.value) || 0, bought: 0 };
      });

      const ev = state.events[state.activeEventId];
      const booth = ev.booths[boothId];
      if (!booth.items) booth.items = {};
      const id = 'item_' + Date.now();
      const order = Object.keys(booth.items).length + 1;

      booth.items[id] = {
        id, name, price, reserve,
        links: link ? [link] : [],
        tags, authors,
        status: 'pending',
        itemImage: tempNewItemImageData,
        divisionCompleted: false,
        order, orders
      };
      tempNewItemImageData = '';
      closeModal(); saveData(); render();
    }

    function openMapUploadModal() {
      const ev = state.events[state.activeEventId];
      if (!ev) return;
      showModal(`
        <div class="flex justify-between items-center mb-3">
          <h3 class="font-bold text-base">上傳或更新會場地圖</h3>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div class="space-y-3">
          <div id="event-map-preview" class="w-full h-40 bg-gray-100 rounded-xl flex items-center justify-center text-xs text-gray-400 overflow-hidden border">
            ${getImageSrc(ev.mapImage) ? renderImgTag(ev.mapImage, 'w-full h-full object-contain', 'data-event-map="true"') : '尚未設定會場地圖'}
          </div>
          <div class="flex gap-2">
            <label class="flex-1 text-center py-2.5 px-3 bg-gray-100 rounded-xl text-xs font-bold text-gray-700 cursor-pointer">
              選擇圖片檔案
              <input type="file" accept="image/*" onchange="handleEventMapUpload(event)" class="hidden" />
            </label>
            <button type="button" onclick="pasteEventMap()" class="py-2.5 px-4 bg-[#4A7C6F]/15 text-[#4A7C6F] rounded-xl text-xs font-bold">剪貼板黏貼</button>
          </div>
          ${getImageSrc(ev.mapImage) ? `<button type="button" onclick="clearEventMap()" class="w-full py-2 bg-red-50 text-red-600 rounded-xl text-xs font-bold">清除會場地圖</button>` : ''}
        </div>
      `);
    }

    async function handleEventMapUpload(e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      const compressed = await readBlobOrFileAsCompressedDataUrl(file, IMAGE_PRESETS.eventMap.maxWidth, IMAGE_PRESETS.eventMap.quality, IMAGE_PRESETS.eventMap.maxBytes);
      const storedVal = await externalizeLargeImage(compressed);
      if (storedVal !== compressed) mediaMemoryCache[storedVal] = compressed;
      const ev = state.events[state.activeEventId];
      ev.mapImage = storedVal;
      saveData(false, `events/${state.activeEventId}/mapImage`, storedVal);
      openMapUploadModal();
    }

    async function pasteEventMap() {
      try {
        const compressed = await extractCompressedImageFromClipboard(IMAGE_PRESETS.eventMap.maxWidth, IMAGE_PRESETS.eventMap.quality, IMAGE_PRESETS.eventMap.maxBytes);
        if (compressed) {
          const storedVal = await externalizeLargeImage(compressed);
          if (storedVal !== compressed) mediaMemoryCache[storedVal] = compressed;
          const ev = state.events[state.activeEventId];
          ev.mapImage = storedVal;
          saveData(false, `events/${state.activeEventId}/mapImage`, storedVal);
          openMapUploadModal();
        } else alert('剪貼板中沒有找到圖片');
      } catch (err) { alert('無法讀取剪貼板圖片'); }
    }

    function clearEventMap() {
      const ev = state.events[state.activeEventId];
      ev.mapImage = '';
      saveData(false, `events/${state.activeEventId}/mapImage`, '');
      openMapUploadModal();
    }

    function openMapPinModal(boothId) {
      const ev = state.events[state.activeEventId];
      const booth = ev && ev.booths[boothId];
      if (!ev || !booth) return;
      if (!getImageSrc(ev.mapImage)) {
        alert('尚未上傳會場地圖，請先至編輯模式上傳會場地圖');
        return;
      }
      let pinX = booth.x || 50;
      let pinY = booth.y || 50;

      showModal(`
        <div class="flex justify-between items-center mb-3">
          <div>
            <h3 class="font-bold text-base">標記攤位位置：${booth.code || ''} ${booth.circle || ''}</h3>
            <p class="text-xs text-gray-400">點擊地圖上對應的攤位位置</p>
          </div>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div id="pin-stage" onclick="handlePinClick(event)" class="relative w-full border rounded-xl overflow-hidden cursor-crosshair bg-gray-100" style="max-height: 55vh;">
          ${renderImgTag(ev.mapImage, 'w-full h-auto block select-none', 'data-event-map="true"')}
          <div id="pin-marker" style="left: ${pinX}%; top: ${pinY}%;" class="absolute -translate-x-1/2 -translate-y-1/2 bg-[#D96B43] text-white text-xs font-bold px-2 py-0.5 rounded-full shadow-lg ring-2 ring-white pointer-events-none">
            ${booth.code || '標記'}
          </div>
        </div>
        <button onclick="confirmMapPin('${boothId}')" class="w-full btn-primary py-2.5 rounded-xl text-sm font-bold mt-3 shadow-sm">儲存位置標記</button>
      `);

      window.handlePinClick = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        pinX = Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100));
        pinY = Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100));
        const marker = document.getElementById('pin-marker');
        if (marker) { marker.style.left = pinX + '%'; marker.style.top = pinY + '%'; }
      };

      window.confirmMapPin = (bId) => {
        booth.x = Number(pinX.toFixed(2));
        booth.y = Number(pinY.toFixed(2));
        closeModal();
        saveData(false, `events/${state.activeEventId}/booths/${bId}`, booth);
      };
    }

    function openMemberModal() {
      showModal(`
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-base">共編成員管理</h3>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div class="space-y-2 mb-4">
          ${state.members.map((m, i) => `
            <div class="flex justify-between items-center bg-gray-50 px-3 py-2 rounded-xl text-sm">
              <span class="font-bold">${m}</span>
              ${state.members.length > 1 ? `<button onclick="removeMember(${i})" class="text-red-500 text-xs">移除</button>` : '<span class="text-xs text-gray-400">主要成員</span>'}
            </div>
          `).join('')}
        </div>
        <div class="flex gap-2">
          <input id="new-member-name" type="text" placeholder="輸入新成員名字..." class="flex-1 border rounded-xl px-3 py-2 text-sm" />
          <button onclick="addMember()" class="btn-primary px-4 py-2 rounded-xl text-sm font-bold">新增</button>
        </div>
      `);
    }

    function addMember() {
      const name = document.getElementById('new-member-name').value.trim();
      if (!name) return;
      if (state.members.includes(name)) return alert('成員已存在');
      state.members.push(name);
      Object.values(state.events || {}).forEach(ev => {
        Object.values(ev.booths || {}).forEach(b => {
          Object.values(b.items || {}).forEach(it => {
            if (!it.orders) it.orders = {};
            if (!it.orders[name]) it.orders[name] = { req: 0, bought: 0 };
          });
        });
      });
      closeModal(); saveData(); openMemberModal();
    }

    function removeMember(idx) {
      if (state.members.length <= 1) return;
      state.members.splice(idx, 1);
      saveData(); openMemberModal();
    }

    function openNewFavModal() {
      showModal(`
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-base">收藏常用作者</h3>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-gray-500">老師／作者名稱 *</label>
            <input id="fav-author" type="text" placeholder="例: 老師A" class="w-full border rounded-xl px-3 py-2 text-sm mt-1" />
          </div>
          <div>
            <label class="text-xs text-gray-500">社團名稱 (選填)</label>
            <input id="fav-circle" type="text" placeholder="例: 八月海" class="w-full border rounded-xl px-3 py-2 text-sm mt-1" />
          </div>
          <div>
            <label class="text-xs text-gray-500">作者鏈結 URL (選填)</label>
            <input id="fav-link" type="text" placeholder="https://..." class="w-full border rounded-xl px-3 py-2 text-sm mt-1" />
          </div>
          <button onclick="createFav()" class="w-full btn-primary py-2.5 rounded-xl font-bold text-sm mt-2">確認收藏</button>
        </div>
      `);
    }

    function createFav() {
      const author = document.getElementById('fav-author').value.trim();
      const circle = document.getElementById('fav-circle').value.trim();
      const link = document.getElementById('fav-link').value.trim();
      if (!author) return alert('請填寫老師／作者名稱');
      state.favorites.push({ id: 'fav_' + Date.now(), circle, author, link, isStarred: true });
      closeModal(); saveData(); render();
    }

    // 啟動初始化
    initData();
  </script>
</body>
</html>
