    }

    // ------------------------------------------
    // 分頁 2：跑攤模式
    // ------------------------------------------
    function renderRunTab(container) {
      const evList = getSortedEvents();
      let currentEv = state.events[state.activeEventId];
      if (!currentEv && evList.length > 0) {
        state.activeEventId = evList[0].id;
        currentEv = evList[0];
      }

      let html = renderEventTabBar(state.activeEventId);
      if (!currentEv) {
        html += `<div class="card p-8 text-center text-gray-400">請先在上方建立展會與攤位</div>`;
        container.innerHTML = html;
        return;
      }

      const eventRunners = (state.runnersByEvent && state.runnersByEvent[currentEv.id]) || [];
      if (state.activeRunner !== 'all' && !eventRunners.includes(state.activeRunner)) {
        state.activeRunner = 'all';
      }

      html += `
        <div class="flex items-center gap-2 mb-3">
          <div class="flex-1 flex gap-2 overflow-x-auto no-scrollbar py-1 items-center">
            <button onclick="selectRunner('all')" class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition shrink-0 ${state.activeRunner === 'all' ? 'bg-[#4A7C6F] text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-100'}">
              全部總覽
            </button>
            ${eventRunners.map(r => `
              <button onclick="selectRunner('${r}')" class="px-3.5 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition shrink-0 ${state.activeRunner === r ? 'bg-[#4A7C6F] text-white shadow-sm' : 'bg-white text-gray-600 border border-gray-100'}">
                <i class="fa-solid fa-person-walking mr-1"></i>${r}
              </button>
            `).join('')}
            <button onclick="openAddRunnerModal()" class="btn-primary px-3 py-1.5 rounded-full text-xs font-bold shadow-sm shrink-0 whitespace-nowrap">
              + 新建跑攤人
            </button>
          </div>
          <div class="shrink-0">
            <button onclick="openEditRunnersModal()" class="px-2.5 py-1.5 rounded-full bg-white border border-gray-200 text-gray-700 text-xs font-bold shadow-sm">編輯跑攤人</button>
          </div>
        </div>
      `;

      if (state.activeRunner && state.activeRunner !== 'all') {
        html += `
          <details class="bg-white p-3 rounded-2xl shadow-sm border border-gray-200 mb-3">
            <summary class="text-xs font-bold text-[#4A7C6F] cursor-pointer select-none">
              <i class="fa-solid fa-sliders mr-1"></i>【${state.activeRunner}】跑攤順序設定 / 套用其他跑攤人順序
            </summary>
            <div class="mt-2.5 pt-2 border-t flex items-center justify-between gap-2 text-xs">
              <span class="text-gray-600">快速套用順序：</span>
              <select onchange="applyRunnerOrderPreset(this.value)" class="flex-1 border rounded-xl px-2.5 py-1.5 text-xs bg-[#F9FAF8] font-bold">
                <option value="">-- 請選擇要套用的順序 --</option>
                <option value="default">預設跑攤順序</option>
                <option value="az">按 A-Z 攤位編號排序</option>
                ${eventRunners.filter(r => r !== state.activeRunner).map(r => `<option value="${r}">套用「${r}」使用中的順序</option>`).join('')}
              </select>
            </div>
          </details>
        `;
      }

      const booths = getSortedBooths(currentEv, state.activeRunner);
      const pendingBooths = booths.filter(b => {
        const items = Object.values(b.items || {});
        return items.length === 0 || items.some(it => {
          const totalReq = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].req) || 0), 0);
          const totalBought = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].bought) || 0), 0);
          const isDone = it.status !== 'pending' || it.divisionCompleted || totalBought >= totalReq;
          return !isDone;
        });
      });

      html += `
        <div class="flex justify-between items-center mb-3">
          <div class="text-sm font-bold text-gray-700">
            ${currentEv.hall || '主展館'} · 還剩 <span class="text-[#D96B43] text-base">${pendingBooths.length}</span> 攤
          </div>
          <div class="bg-white p-1 rounded-full shadow-sm border border-gray-200 flex text-xs">
            <button onclick="setRunMode('list')" class="px-3 py-1 rounded-full font-medium ${state.runMode === 'list' ? 'bg-[#4A7C6F] text-white' : 'text-gray-600'}">跑攤清單</button>
            <button onclick="setRunMode('map')" class="px-3 py-1 rounded-full font-medium ${state.runMode === 'map' ? 'bg-[#4A7C6F] text-white' : 'text-gray-600'}">會場地圖</button>
          </div>
        </div>

        <div class="flex justify-between items-center mb-3 px-1 flex-wrap gap-2">
          <div class="flex items-center gap-1.5 bg-white p-1 rounded-xl shadow-sm border border-gray-200 text-[11px]">
            <span class="text-gray-400 pl-1">預覽:</span>
            <button onclick="setRunImageMode('small')" class="px-2 py-0.5 rounded ${state.runImageMode === 'small' ? 'bg-[#4A7C6F] text-white font-bold' : 'text-gray-600'}">小圖</button>
            <button onclick="setRunImageMode('medium')" class="px-2 py-0.5 rounded ${state.runImageMode === 'medium' ? 'bg-[#4A7C6F] text-white font-bold' : 'text-gray-600'}">中圖</button>
            <button onclick="setRunImageMode('large')" class="px-2 py-0.5 rounded ${state.runImageMode === 'large' ? 'bg-[#4A7C6F] text-white font-bold' : 'text-gray-600'}">大圖</button>
          </div>
        </div>
      `;

      if (state.runMode === 'map') {
        if (!getImageSrc(currentEv.mapImage)) {
          html += `
            <div class="card p-8 text-center">
              <i class="fa-solid fa-map-location-dot text-4xl text-gray-300 mb-3"></i>
              <p class="text-sm text-gray-500 mb-4">尚未上傳會場地圖圖片</p>
              <button onclick="openMapUploadModal()" class="btn-primary px-4 py-2 rounded-xl text-sm font-bold">立即上傳地圖</button>
            </div>
          `;
        } else {
          html += `
            <div class="card p-2 overflow-hidden relative">
              <div class="text-xs text-gray-400 mb-2 px-2">點擊攤位標籤可快速查看</div>
              <div class="relative w-full overflow-auto border rounded-xl bg-gray-100" style="max-height: 65vh;">
                ${renderImgTag(currentEv.mapImage, 'w-full h-auto block', 'data-event-map="true"')}
                ${booths.map((b, i) => {
                  const itemsArr = Object.values(b.items || {});
                  const isDone = itemsArr.length > 0 && itemsArr.every(it => {
                    const totalReq = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].req) || 0), 0);
                    const totalBought = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].bought) || 0), 0);
                    return it.status !== 'pending' || it.divisionCompleted || totalBought >= totalReq;
                  });
                  return `
                    <div style="left: ${b.x || 50}%; top: ${b.y || 50}%;" 
                         class="absolute -translate-x-1/2 -translate-y-1/2 px-2 py-0.5 rounded-full text-[11px] font-bold shadow-md whitespace-nowrap
                         ${isDone ? 'bg-gray-500/80 text-white line-through' : 'bg-[#D96B43] text-white ring-2 ring-white'}">
                      ${i + 1}. ${b.code}
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          `;
        }
        container.innerHTML = html;
        return;
      }

      html += `<div id="sortable-booth-list" data-runner="${state.activeRunner || 'all'}">`;

      booths.forEach((b, idx) => {
        const items = getSortedItems(b);
        const authors = getBoothAuthors(b);
        const boothTotal = items.reduce((sum, it) => {
          const reqSum = Object.values(it.orders || {}).reduce((s, o) => s + (o.req || 0), 0);
          return sum + (it.price * reqSum);
        }, 0);

        const isAllDone = items.length > 0 && items.every(it => {
          const totalReq = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].req) || 0), 0);
          const totalBought = state.members.reduce((s, m) => s + ((it.orders && it.orders[m] && it.orders[m].bought) || 0), 0);
          return it.status !== 'pending' || it.divisionCompleted || totalBought >= totalReq;
        });

        const boothMapImgSize = state.runImageMode === 'small' ? 'w-8 h-8' : state.runImageMode === 'large' ? 'w-20 h-20' : 'w-12 h-12';

        const memberSashiireMap = {};
        authors.forEach(auth => {
          (auth.sashiire || []).forEach(m => {
            if (!memberSashiireMap[m]) memberSashiireMap[m] = { count: 0, allGiven: true, authorNames: [] };
            memberSashiireMap[m].count += 1;
            memberSashiireMap[m].authorNames.push(auth.name || '未命名');
            if (!auth.sashiireGiven || !auth.sashiireGiven[m]) {
              memberSashiireMap[m].allGiven = false;
            }
          });
        });
        const sashiireEntries = Object.entries(memberSashiireMap);

        html += `
          <div class="card p-4 mb-3 transition booth-card ${isAllDone ? 'opacity-60 bg-gray-50' : 'border-l-4 border-l-[#4A7C6F]'}" data-booth-id="${b.id}">
            <div class="flex justify-between items-center mb-3">
              <div class="flex items-center gap-2">
                <div class="drag-handle cursor-grab active:cursor-grabbing text-gray-400 hover:text-gray-700 px-1.5 py-2 touch-none select-none" data-booth-id="${b.id}" data-idx="${idx}" title="按住拖曳排序，或輕點調整">
                  <i class="fa-solid fa-bars text-sm"></i>
                </div>
                <span class="booth-map-img-slot contents">${b.boothMapImage ? renderImgTag(b.boothMapImage, `${boothMapImgSize} object-cover rounded-lg border shrink-0 transition-all`, 'title="攤位圖"') : ''}</span>
                <div>
                  <div class="flex items-center gap-2 flex-wrap">
                    <span class="text-xs font-bold text-[#4A7C6F]">#${idx + 1}</span>
                    ${b.code ? `<span class="font-bold text-lg">${b.code}</span>` : ''}
                    ${b.circle ? `<span class="text-sm text-gray-600">${b.circle}</span>` : ''}
                    <span class="bg-[#D96B43]/10 text-[#D96B43] text-xs font-bold px-2 py-0.5 rounded-full">預計: ${formatCurrency(boothTotal, currentEv.id)}</span>
                  </div>
                </div>
              </div>
              <button onclick="openMapPinModal('${b.id}')" class="text-xs text-gray-500 bg-gray-100 px-2.5 py-1 rounded-full shrink-0">
                <i class="fa-solid fa-location-dot text-[#D96B43] mr-1"></i>標記位置
              </button>
            </div>

            ${sashiireEntries.length > 0 ? `
              <div class="mb-3 bg-amber-50/90 border border-amber-200 p-2.5 rounded-xl space-y-1.5">
                <div class="text-[11px] font-bold text-amber-800"><i class="fa-solid fa-gift mr-1"></i>差し入れ 交付確認：</div>
                <div class="flex flex-wrap gap-2">
                  ${sashiireEntries.map(([m, info]) => `
                    <label class="flex items-center gap-1.5 bg-white px-2.5 py-1.5 rounded-lg border border-amber-200 cursor-pointer text-xs font-bold shadow-sm ${info.allGiven ? 'line-through text-gray-400 bg-gray-100' : 'text-gray-800'}">
                      <input type="checkbox" ${info.allGiven ? 'checked' : ''} onchange="toggleBoothSashiireGiven('${b.id}', '${m}', this.checked)" class="w-4 h-4 accent-[#4A7C6F] rounded" />
                      <span>${m} ×${info.count} <span class="text-[10px] text-gray-500 font-normal">(➔ ${info.authorNames.join('、')})</span></span>
                    </label>
                  `).join('')}
                </div>
              </div>
            ` : ''}

            <div class="space-y-3">
              ${items.map(it => {
                const totalReq = Object.values(it.orders || {}).reduce((s, o) => s + (o.req || 0), 0);
                const totalBought = Object.values(it.orders || {}).reduce((s, o) => s + (o.bought || 0), 0);
                const isExpanded = !!state.expandedRunItems[it.id];
                const runImgClass = state.runImageMode === 'small' ? 'w-10 h-10' : state.runImageMode === 'large' ? 'w-24 h-24' : 'w-16 h-16';

                const purchasedBy = it.purchasedBy || {};
                const buyerLabels = Object.entries(purchasedBy)
                  .filter(([_, cnt]) => cnt > 0)
                  .map(([runnerName, cnt]) => `<span class="inline-block bg-[#4A7C6F] text-white font-bold text-[11px] px-2 py-0.5 rounded ml-1">${runnerName}×${cnt}</span>`)
                  .join('');

                const currentRunner = state.activeRunner || 'all';
                const runnerPurchasedCount = currentRunner !== 'all' ? (purchasedBy[currentRunner] || 0) : totalBought;

                return `
                  <div class="item-box-deep-green p-3 rounded-xl" data-run-item-id="${it.id}">
                    <div class="flex justify-between items-start mb-2">
                      <div class="flex items-center gap-2.5">
                        <span class="run-item-img-slot contents">${it.itemImage ? renderImgTag(it.itemImage, `${runImgClass} object-cover rounded-lg border border-white shrink-0 transition-all`) : ''}</span>
                        <div>
                          <div class="font-bold text-sm text-[#2C3531] flex items-center flex-wrap gap-1">
                            <span>${it.name}</span>
                            <span class="run-item-buyers-slot contents">${buyerLabels}</span>
                          </div>
                          <div class="text-xs font-bold text-[#D96B43] mt-0.5 flex items-center gap-2 flex-wrap">
                            <span>${formatCurrency(it.price, currentEv.id)}</span>
                            <span class="text-gray-600 font-normal">(全團總需求 ${totalReq})</span>
                            ${(it.reserve || 0) > 0 ? `<span class="bg-emerald-700 text-white px-1.5 py-0.5 rounded font-bold text-[10px]">留貨: ${it.reserve}</span>` : ''}
                          </div>
                          ${it.status === 'skip' ? '<div class="inline-block bg-gray-600 text-white text-[10px] px-2 py-0.5 rounded mt-1 font-bold">已放棄</div>' : ''}
                        </div>
                      </div>
                      
                      <div class="run-item-status-slot flex gap-1 shrink-0">
                        <button onclick="setItemStatus('${b.id}', '${it.id}', 'done')" class="px-2 py-1 rounded text-[11px] font-bold border ${it.status === 'done' ? 'bg-[#4A7C6F] text-white border-[#4A7C6F]' : 'bg-white text-gray-700 border-gray-300'}">買齊</button>
                        <button onclick="setItemStatus('${b.id}', '${it.id}', 'soldout')" class="px-2 py-1 rounded text-[11px] font-bold border ${it.status === 'soldout' ? 'bg-amber-500 text-white border-amber-500' : 'bg-white text-gray-700 border-gray-300'}">售空</button>
                        <button onclick="toggleSkip('${b.id}', '${it.id}')" class="px-2 py-1 rounded text-[11px] font-bold border ${it.status === 'skip' ? 'bg-gray-600 text-white border-gray-600' : 'bg-white text-gray-700 border-gray-300'}">${it.status === 'skip' ? '取消放棄' : '放棄'}</button>
                      </div>
                    </div>

                    <div class="flex items-center justify-between bg-white px-3 py-2 rounded-xl border border-gray-200 my-2">
                      <span class="text-xs font-bold text-gray-700">
                        ${currentRunner !== 'all' ? `【${currentRunner}】總買到數量 (含代購)` : '全團總買到數量'}
                      </span>
                      <div class="flex items-center gap-2">
                        <button onclick="updateRunnerPurchaseQty('${b.id}', '${it.id}', -1)" class="w-7 h-7 rounded bg-gray-100 font-bold text-gray-600">-</button>
                        <span class="run-item-count-label font-bold w-14 text-center ${totalBought >= totalReq ? 'text-[#4A7C6F]' : 'text-[#D96B43]'}">
                          ${currentRunner !== 'all' ? `${runnerPurchasedCount} 件` : `${totalBought}/${totalReq}`}
                        </span>
                        <button onclick="updateRunnerPurchaseQty('${b.id}', '${it.id}', 1)" class="w-7 h-7 rounded bg-[#4A7C6F]/15 font-bold text-[#4A7C6F]">+</button>
                      </div>
                    </div>

                    <div>
                      <button onclick="toggleRunItemExpand('${it.id}')" class="text-xs text-[#2C3531] font-bold flex items-center gap-1 hover:underline py-1">
                        <i class="fa-solid fa-chevron-${isExpanded ? 'up' : 'down'} text-[10px]"></i>
                        ${isExpanded ? '收起成員明細' : '展開成員明細 (按人分配)'}
                      </button>

                      ${isExpanded ? `
                        <div class="space-y-1.5 pt-2 mt-1 border-t border-gray-300/60 bg-white/80 p-2.5 rounded-xl">
                          ${state.members.map(m => {
                            const ord = (it.orders && it.orders[m]) || { req: 0, bought: 0 };
                            if (ord.req === 0 && ord.bought === 0) return '';
                            return `
                              <div class="flex justify-between items-center text-xs">
                                <span class="font-medium text-gray-700">${m} <span class="text-gray-400">(需求 ${ord.req})</span></span>
                                <div class="flex items-center gap-2 bg-white px-2 py-1 rounded-lg border border-gray-200">
                                  <button onclick="updateBoughtQty('${b.id}', '${it.id}', '${m}', -1)" class="w-6 h-6 rounded bg-gray-100 font-bold text-gray-600">-</button>
                                  <span class="font-bold w-8 text-center ${ord.bought >= ord.req ? 'text-[#4A7C6F]' : 'text-[#D96B43]'}">${ord.bought}/${ord.req}</span>
                                  <button onclick="updateBoughtQty('${b.id}', '${it.id}', '${m}', 1)" class="w-6 h-6 rounded bg-[#4A7C6F]/15 font-bold text-[#4A7C6F]">+</button>
                                </div>
                              </div>
                            `;
                          }).join('')}
                        </div>
                      ` : ''}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      });

      html += `</div>`;
      container.innerHTML = html;
      initDragAndDrop();
    }

    function selectRunner(runnerName) { state.activeRunner = runnerName; render(); }

    function openAddRunnerModal() {
      const evId = state.activeEventId;
      const existingRunners = (state.runnersByEvent && state.runnersByEvent[evId]) || [];
      const availableMembers = state.members.filter(m => !existingRunners.includes(m));

        <div class="flex justify-between items-center mb-4">

              <div class="flex flex-wrap gap-2">
                ${availableMembers.map(m => `
                  <button type="button" onclick="confirmAddRunner('${m}')" class="px-3.5 py-1.5 rounded-full bg-[#4A7C6F]/10 text-[#4A7C6F] text-xs font-bold hover:bg-[#4A7C6F] hover:text-white transition">+ ${m}</button>

    function confirmAddRunner(name) {
      const evId = state.activeEventId;
      if (!state.runnersByEvent[evId]) state.runnersByEvent[evId] = [];
      if (!state.runnersByEvent[evId].includes(name)) state.runnersByEvent[evId].push(name);
      state.activeRunner = name;
      closeModal(); saveData(); render();
    }

    function createAndAddRunner() {
      const inp = document.getElementById('instant-new-runner-name');
      if (!inp) return;
      const name = inp.value.trim();
      if (!name) return alert('請輸入名稱');
      if (!state.members.includes(name)) state.members.push(name);
      confirmAddRunner(name);
    }

    function openEditRunnersModal() {
      const evId = state.activeEventId;
      const existingRunners = (state.runnersByEvent && state.runnersByEvent[evId]) || [];
      showModal(`
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-base">編輯跑攤人名單</h3>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div class="space-y-2">
          ${existingRunners.length === 0 ? '<div class="text-xs text-gray-400 py-4 text-center">尚未新增任何跑攤人</div>' : existingRunners.map((r, idx) => `
            <div class="flex justify-between items-center bg-gray-50 px-3 py-2.5 rounded-xl text-sm font-bold">
              <span>${r}</span>
              <button onclick="removeRunnerFromEvent(${idx})" class="text-red-500 text-xs px-2 py-1 bg-red-50 rounded-lg">移除跑攤人</button>
            </div>
          `).join('')}
        </div>
      `);
