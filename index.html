    function bindCropEvents() {
      const stage = document.getElementById('crop-stage');
      const cropBox = document.getElementById('crop-box');
      if (!stage || !cropBox) return;

      let action = null, startX = 0, startY = 0, startBox = { ...cropState.box };

      const onStart = (e) => {
        const touch = e.touches ? e.touches[0] : e;
        startX = touch.clientX; startY = touch.clientY; startBox = { ...cropState.box };
        if (e.target.dataset.handle) action = e.target.dataset.handle;
        else if (e.target === cropBox || cropBox.contains(e.target)) action = 'move';
      };

      const onMove = (e) => {
        if (!action) return;
        e.preventDefault();
        const touch = e.touches ? e.touches[0] : e;
        const rect = stage.getBoundingClientRect();
        const dxPct = ((touch.clientX - startX) / rect.width) * 100;
        const dyPct = ((touch.clientY - startY) / rect.height) * 100;
        let { x, y, w, h } = startBox;
        const minSize = 10;

        if (action === 'move') {
          x = Math.max(0, Math.min(100 - w, x + dxPct));
          y = Math.max(0, Math.min(100 - h, y + dyPct));
        } else if (action === 'se') {
          w = Math.max(minSize, Math.min(100 - x, w + dxPct));
          h = Math.max(minSize, Math.min(100 - y, h + dyPct));
        } else if (action === 'sw') {
          const newX = Math.max(0, Math.min(x + w - minSize, x + dxPct));
          w = w + (x - newX); x = newX;
          h = Math.max(minSize, Math.min(100 - y, h + dyPct));
        } else if (action === 'ne') {
          w = Math.max(minSize, Math.min(100 - x, w + dxPct));
          const newY = Math.max(0, Math.min(y + h - minSize, y + dyPct));
          h = h + (y - newY); y = newY;
        } else if (action === 'nw') {
          const newX = Math.max(0, Math.min(x + w - minSize, x + dxPct));
          w = w + (x - newX); x = newX;
          const newY = Math.max(0, Math.min(y + h - minSize, y + dyPct));
          h = h + (y - newY); y = newY;
        }

        cropState.box = { x, y, w, h };
        cropBox.style.left = x + '%'; cropBox.style.top = y + '%';
        cropBox.style.width = w + '%'; cropBox.style.height = h + '%';
      };

      const onEnd = () => { action = null; };
      stage.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
      stage.addEventListener('touchstart', onStart, { passive: false });
      window.addEventListener('touchmove', onMove, { passive: false });
      window.addEventListener('touchend', onEnd);
    }

    function confirmCropImage() {
      const img = document.getElementById('crop-source-img');
      if (!img) return;
      const { boothId, itemId, isNewItemModal, box } = cropState;
      const canvas = document.createElement('canvas');
      const natW = img.naturalWidth, natH = img.naturalHeight;
      const sx = (box.x / 100) * natW, sy = (box.y / 100) * natH;
      const sw = (box.w / 100) * natW, sh = (box.h / 100) * natH;
      canvas.width = sw; canvas.height = sh;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);

      const croppedUrl = canvas.toDataURL('image/jpeg', 0.85);
      if (isNewItemModal) {
        tempNewItemImageData = croppedUrl;
        openNewItemModal(boothId);
      } else {
        state.events[state.activeEventId].booths[boothId].items[itemId].itemImage = croppedUrl;
        saveData(); closeModal(); render();
      }
    }

    function updateBoughtQty(boothId, itemId, member, delta) {
      const item = state.events[state.activeEventId].booths[boothId].items[itemId];
      if (item.divisionCompleted) item.divisionCompleted = false;

      if (!item.orders[member]) item.orders[member] = { req: 0, bought: 0 };
      const nextVal = Math.max(0, (item.orders[member].bought || 0) + delta);
      item.orders[member].bought = nextVal;

      const allMet = Object.values(item.orders).every(o => (o.bought || 0) >= (o.req || 0));
      if (allMet && nextVal > 0) item.status = 'done';
      else if (item.status === 'done' && !allMet) item.status = 'pending';
      saveData();
    }

    function setItemStatus(boothId, itemId, status) {
      const item = state.events[state.activeEventId].booths[boothId].items[itemId];
      if (item.divisionCompleted) item.divisionCompleted = false;

      if (status === 'soldout') {
        item.status = 'soldout';
        Object.keys(item.orders || {}).forEach(m => { if (item.orders[m]) item.orders[m].bought = 0; });
        item.purchasedBy = {};
      } else if (status === 'done') {
        item.status = 'done';
        Object.keys(item.orders || {}).forEach(m => { if (item.orders[m]) item.orders[m].bought = item.orders[m].req; });
      } else {
        item.status = status;
      }
      saveData();
    }

            <div class="author-search-dropdown hidden search-dropdown"></div>
          </div>
          <button type="button" onclick="removeThisParent(this.parentElement.parentElement)" class="text-red-400 px-1"><i class="fa-solid fa-trash text-xs"></i></button>
        </div>
        <div class="space-y-1">
          <div class="flex justify-between items-center">
            <span class="text-[10px] text-gray-400">作者鏈結</span>
            <button type="button" onclick="addSingleAuthorLink(this)" class="text-[10px] text-[#4A7C6F] font-bold">+ 鏈結</button>
          </div>
          <div class="author-links-list space-y-1">
            <div class="flex gap-1 items-center">
              <input type="text" placeholder="https://..." class="new-b-author-link flex-1 border rounded px-2 py-0.5 text-[11px]" />
              <button type="button" onclick="pasteToInput(this)" class="px-1.5 py-0.5 bg-gray-100 rounded text-[10px] font-bold">黏貼</button>
            </div>
          </div>
        </div>
      `;
      c.appendChild(d);
    }

    function handleNewBoothMapUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        tempNewBoothMapData = evt.target.result;
        const prev = document.getElementById('new-b-map-preview');
        if (prev) prev.innerHTML = `<img src="${tempNewBoothMapData}" class="w-full h-full object-cover rounded" />`;
      };
      reader.readAsDataURL(file);
    }

    async function pasteNewBoothMap() {
      try {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          for (const type of item.types) {
            if (type.startsWith('image/')) {
              const blob = await item.getType(type);
              const reader = new FileReader();
              reader.onload = function(evt) {
                tempNewBoothMapData = evt.target.result;
                const prev = document.getElementById('new-b-map-preview');
                if (prev) prev.innerHTML = `<img src="${tempNewBoothMapData}" class="w-full h-full object-cover rounded" />`;
              };
              reader.readAsDataURL(blob);
              return;
            }
          }
        }
        alert('剪貼板無圖片');
      } catch (e) { alert('無法讀取剪貼板'); }
    }

    function addNewBoothFlyerInput(url = '', link = '') {
      const c = document.getElementById('new-b-flyers-container');
      if (!c) return;
      const d = document.createElement('div');
      d.className = 'bg-white p-2 rounded border space-y-1.5 new-b-flyer-item';
      d.innerHTML = `
        <div class="flex items-center gap-2">
          <div class="w-10 h-10 bg-gray-100 rounded flex items-center justify-center text-[9px] text-gray-400 shrink-0 flyer-thumb-box" data-url="${url}">${url ? `<img src="${url}" class="w-full h-full object-cover rounded" />` : '無圖'}</div>
          <div class="flex-1 space-y-1">
            <input type="text" value="${link}" placeholder="此攤宣連結 URL" class="new-b-flyer-link flex-1 border rounded px-2 py-1 text-[11px] w-full" />
            <div class="flex gap-2">
              <label class="text-[10px] text-[#4A7C6F] font-bold cursor-pointer underline">上傳圖片<input type="file" accept="image/*" onchange="handleNewBoothFlyerFile(event, this)" class="hidden" /></label>
              <button type="button" onclick="removeThisParent(this.closest('.new-b-flyer-item'))" class="text-red-400 text-[10px]">刪除此攤宣</button>
            </div>
          </div>
        </div>
      `;
      c.appendChild(d);
    }

    function handleNewBoothFlyerFile(e, fileInp) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const itemDiv = fileInp.closest('.new-b-flyer-item');
        const thumb = itemDiv.querySelector('.flyer-thumb-box');
        thumb.dataset.url = evt.target.result;
        thumb.innerHTML = `<img src="${evt.target.result}" class="w-full h-full object-cover rounded" />`;
      };
      reader.readAsDataURL(file);
    }

    function createBooth() {
      const code = document.getElementById('new-b-code').value.trim() || '未編號';
      const circle = document.getElementById('new-b-circle').value.trim() || '未命名社團';
      
      const authorBlocks = document.querySelectorAll('.new-author-block');
      const authors = Array.from(authorBlocks).map((blk, idx) => {
        const name = blk.querySelector('.new-b-author-name').value.trim();
        const links = Array.from(blk.querySelectorAll('.new-b-author-link')).map(i => i.value.trim()).filter(Boolean);
        return {
          name,
          links,
          sashiire: [],
          sashiireGiven: {}
        };
      }).filter(a => a.name);

      if (authors.length === 0) return alert('請至少填寫一位作者名稱！');

      const flyerItems = document.querySelectorAll('.new-b-flyer-item');
      const flyerImages = [];
      flyerItems.forEach(item => {
        const thumb = item.querySelector('.flyer-thumb-box');
        const linkInp = item.querySelector('.new-b-flyer-link');
        const url = (thumb && thumb.dataset.url) || '';
        const link = (linkInp && linkInp.value.trim()) || '';
        if (url || link) flyerImages.push({ url, link });
      });

      const ev = state.events[state.activeEventId];
      if (!ev.booths) ev.booths = {};
      const id = 'b_' + Date.now();
      const order = Object.keys(ev.booths).length + 1;
      
      ev.booths[id] = {
        id, code, circle, authors,
        boothMapImage: tempNewBoothMapData,
        flyerImages,
        order, x: 50, y: 50, items: {}
      };

      tempNewBoothMapData = '';
      closeModal(); saveData(); render();
    }

    let tempNewItemImageData = '';

    function openNewItemModal(boothId) {
      const booth = state.events[state.activeEventId].booths[boothId];
      const boothAuthors = getBoothAuthors(booth);
      const currentEv = state.events[state.activeEventId];

      showModal(`
        <div class="flex justify-between items-center mb-4">
          <div class="flex items-center gap-2">
            <h3 class="font-bold text-base">新增購買商品</h3>
          </div>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div class="space-y-3 max-h-[75vh] overflow-y-auto pr-1">
          <div>
            <label class="text-xs text-gray-500">商品名稱 *</label>
            <input id="it-name" type="text" placeholder="例如：新刊 / 既刊" class="w-full border rounded-xl px-3 py-2 text-sm mt-1" />
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-xs text-gray-500">單價 (${currentEv.currency || 'JPY'}) *</label>
              <input id="it-price" type="number" placeholder="500" class="w-full border rounded-xl px-3 py-2 text-sm mt-1" />
            </div>
            <div>
              <label class="text-xs text-gray-500">留貨數量</label>
              <input id="it-reserve" type="number" min="0" value="0" placeholder="0" class="w-full border rounded-xl px-3 py-2 text-sm mt-1 font-bold text-[#4A7C6F]" />
            </div>
          </div>

          <div class="bg-gray-50 p-2.5 rounded-xl border space-y-1.5">
            <label class="text-xs font-bold text-gray-700 block">商品創作者 (可多選)</label>
            <div id="new-item-authors-checkboxes" class="flex flex-wrap gap-1.5 items-center">
              ${boothAuthors.map(a => `
                <label class="flex items-center gap-1 px-2 py-1 rounded border text-xs cursor-pointer bg-white border-gray-200">
                  <input type="checkbox" value="${a.name}" class="new-item-author-chk w-3.5 h-3.5 accent-[#4A7C6F]" />
                  <span>${a.name}</span>
                </label>
              `).join('')}
            </div>
            <div class="relative pt-1">
              <input type="text" id="new-item-extra-author-input" placeholder="輸入其他作者名稱 (即時搜尋作者庫)..." oninput="handleNewItemAuthorSearchInputLive(this)" class="w-full border rounded px-2 py-1 text-xs" autocomplete="off" />
              <div class="new-item-author-search-dropdown hidden search-dropdown"></div>
            </div>
          </div>

          <div class="bg-gray-50 p-2.5 rounded-xl border space-y-1.5">
            <div class="flex justify-between items-center">
              <label class="text-[11px] font-bold text-gray-600">商品連結 URL (可複數)</label>
              <button type="button" onclick="addNewItemLinkInput()" class="text-[10px] text-[#4A7C6F] font-bold">+ 新增連結</button>
            </div>
            <div id="new-it-links-container" class="space-y-1">
              <div class="flex gap-1.5 items-center">
                <input type="text" placeholder="https://..." class="new-it-link-input flex-1 border rounded px-2 py-1 text-xs" />
                <button type="button" onclick="pasteToInput(this)" class="px-2 py-0.5 bg-[#4A7C6F]/15 text-[#4A7C6F] rounded text-[10px] font-bold">黏貼</button>
              </div>
            </div>
          </div>

          <div>
            <label class="text-xs text-gray-500 block mb-1">商品標籤</label>
            <input id="it-tags" type="text" placeholder="例如：R-18, 漫畫, 新刊" class="w-full border rounded-xl px-3 py-2 text-sm mb-1.5" />
            <div class="text-[10px] text-gray-400 mb-1">常用標籤點擊快速新增：</div>
            <div class="flex flex-wrap gap-1">
              ${getTopTags().map(t => `
                <button type="button" onclick="appendTagToInput('it-tags', '${t}')" class="px-2 py-0.5 bg-white border border-gray-200 rounded text-[10px] text-gray-600 hover:bg-[#4A7C6F]/10 hover:text-[#4A7C6F]">#${t}</button>
              `).join('')}
            </div>
          </div>

          <div class="bg-gray-50 p-2.5 rounded-xl border">
            <label class="text-[11px] font-bold text-gray-600 block mb-1">商品圖片</label>
            <div class="flex items-center gap-2 flex-wrap">
              <div id="new-it-img-preview" class="w-11 h-11 bg-gray-200 rounded text-[9px] text-gray-400 flex items-center justify-center shrink-0">
                ${tempNewItemImageData ? `<img src="${tempNewItemImageData}" class="w-full h-full object-cover rounded" />` : '無圖'}
              </div>
              <label class="py-1.5 px-2.5 bg-white border rounded-lg text-xs font-medium cursor-pointer">
                上傳<input type="file" accept="image/*" onchange="handleNewItemImageUpload(event)" class="hidden" />
              </label>
              <button type="button" onclick="openCropFromFlyerModal('${boothId}', '', 0, true)" class="py-1.5 px-2.5 bg-amber-100 text-amber-800 rounded-lg text-xs font-bold">
                <i class="fa-solid fa-crop-simple mr-1"></i>截取
              </button>
              <button type="button" onclick="pasteNewItemImage()" class="py-1.5 px-2.5 bg-[#4A7C6F]/15 text-[#4A7C6F] rounded-lg text-xs font-bold">黏貼</button>
            </div>
          </div>

          <div class="pt-2 border-t">
            <label class="text-xs font-bold text-gray-700 block mb-2">各成員需求數量：</label>
            <div class="space-y-2">
              ${state.members.map(m => `
                <div class="flex justify-between items-center bg-gray-50 px-3 py-2 rounded-xl">
                  <span class="text-sm font-medium">${m}</span>
                  <input type="number" min="0" value="0" data-member="${m}" class="member-req-input w-20 border rounded-lg px-2 py-1 text-center text-sm font-bold" />
                </div>
              `).join('')}
            </div>
          </div>
          <button type="button" onclick="createItem('${boothId}')" class="w-full btn-primary py-2.5 rounded-xl text-sm font-bold mt-2">加入清單</button>
        </div>
      `);
    }

    function addNewItemLinkInput() {
      const c = document.getElementById('new-it-links-container');
      if (!c) return;
      const d = document.createElement('div');
      d.className = 'flex gap-1.5 items-center';
      d.innerHTML = `<input type="text" placeholder="https://..." class="new-it-link-input flex-1 border rounded px-2 py-1 text-xs" /><button type="button" onclick="pasteToInput(this)" class="px-2 py-0.5 bg-[#4A7C6F]/15 text-[#4A7C6F] rounded text-[10px] font-bold">黏貼</button><button type="button" onclick="removeThisParent(this)" class="text-red-400 px-1"><i class="fa-solid fa-trash text-xs"></i></button>`;
      c.appendChild(d);
    }

    function handleNewItemImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        tempNewItemImageData = evt.target.result;
        const prev = document.getElementById('new-it-img-preview');
        if (prev) prev.innerHTML = `<img src="${tempNewItemImageData}" class="w-full h-full object-cover rounded" />`;
      };
      reader.readAsDataURL(file);
    }

    async function pasteNewItemImage() {
      try {
        const items = await navigator.clipboard.read();
        for (const item of items) {
          for (const type of item.types) {
            if (type.startsWith('image/')) {
              const blob = await item.getType(type);
              const reader = new FileReader();
              reader.onload = function(evt) {
                tempNewItemImageData = evt.target.result;
                const prev = document.getElementById('new-it-img-preview');
                if (prev) prev.innerHTML = `<img src="${tempNewItemImageData}" class="w-full h-full object-cover rounded" />`;
              };
              reader.readAsDataURL(blob);
              return;
            }
          }
        }
        alert('剪貼板無圖片');
      } catch (e) { alert('無法讀取剪貼板'); }
    }

    function createItem(boothId) {
      const name = document.getElementById('it-name').value.trim();
      const price = parseFloat(document.getElementById('it-price').value) || 0;
      const reserve = parseInt(document.getElementById('it-reserve').value) || 0;
      if (!name) return alert('請輸入商品名稱');

      const links = Array.from(document.querySelectorAll('.new-it-link-input')).map(i => i.value.trim()).filter(Boolean);
      const tagsInput = document.getElementById('it-tags');
      const tags = tagsInput ? tagsInput.value.split(',').map(s => s.trim()).filter(Boolean) : [];

      const authorCheckboxes = document.querySelectorAll('.new-item-author-chk:checked');
      const chosenAuthors = Array.from(authorCheckboxes).map(c => c.value);

      const orders = {};
      document.querySelectorAll('.member-req-input').forEach(inp => {
        const m = inp.dataset.member;
        const req = parseInt(inp.value) || 0;
        orders[m] = { req, bought: 0 };
      });

      const ev = state.events[state.activeEventId];
      if (!ev.booths[boothId].items) ev.booths[boothId].items = {};
      const id = 'item_' + Date.now();
      const order = Object.keys(ev.booths[boothId].items).length + 1;

      ev.booths[boothId].items[id] = {
        id, name, price, reserve, links, tags, authors: chosenAuthors, order,
        status: 'pending', itemImage: tempNewItemImageData, divisionCompleted: false, orders
      };
      
      tempNewItemImageData = '';
      closeModal(); saveData(); render();
    }

    function openMapUploadModal() {
      showModal(`
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-base">上傳會場地圖</h3>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <p class="text-xs text-gray-500 mb-3">選擇一張會場平面圖</p>
        <input type="file" accept="image/*" onchange="handleMapUpload(event)" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-[#4A7C6F]/10 file:text-[#4A7C6F]" />
      `);
    }

    function handleMapUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        state.events[state.activeEventId].mapImage = evt.target.result;
        closeModal(); saveData(); render();
      };
      reader.readAsDataURL(file);
    }

    function openMapPinModal(boothId) {
      const ev = state.events[state.activeEventId];
      if (!ev.mapImage) return alert('請先在「編輯模式」分頁上傳會場地圖！');
      const booth = ev.booths[boothId];
      showModal(`
        <div class="flex justify-between items-center mb-2">
          <h3 class="font-bold text-sm">點擊地圖標記「${booth.code}」位置</h3>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div class="relative border rounded-xl overflow-hidden cursor-crosshair" onclick="saveMapPin(event, '${boothId}')">
          <img src="${ev.mapImage}" class="w-full h-auto block" />
          <div style="left: ${booth.x}%; top: ${booth.y}%;" class="absolute -translate-x-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-[#D96B43] border-2 border-white shadow"></div>
        </div>
      `);
    }

    function saveMapPin(e, boothId) {
      const rect = e.currentTarget.getBoundingClientRect();
      const x = Math.round(((e.clientX - rect.left) / rect.width) * 100);
      const y = Math.round(((e.clientY - rect.top) / rect.height) * 100);
      state.events[state.activeEventId].booths[boothId].x = x;
      state.events[state.activeEventId].booths[boothId].y = y;
      closeModal(); saveData(); render();
    }

    function openNewFavModal() {
      showModal(`
        <div class="flex justify-between items-center mb-4">
          <h3 class="font-bold text-base">新增常用作者</h3>
          <button onclick="closeModal()" class="text-gray-400 text-lg">&times;</button>
        </div>
        <div class="space-y-3">
          <input id="fav-circle" type="text" placeholder="社團名稱 *" class="w-full border rounded-xl px-3 py-2 text-sm" />
          <input id="fav-author" type="text" placeholder="作者名稱" class="w-full border rounded-xl px-3 py-2 text-sm" />
          <div class="flex gap-1.5">
            <input id="fav-link" type="text" placeholder="SNS / 攤宣網址 (選填)" class="flex-1 border rounded-xl px-3 py-2 text-sm" />
            <button type="button" onclick="pasteToInput(this)" class="px-3 bg-[#4A7C6F]/15 text-[#4A7C6F] rounded-xl text-xs font-bold">黏貼</button>
          </div>
          <button type="button" onclick="saveFav()" class="w-full btn-primary py-2.5 rounded-xl text-sm font-bold">儲存收藏</button>
        </div>
      `);
    }

    function saveFav() {
      const circle = document.getElementById('fav-circle').value.trim();
      const author = document.getElementById('fav-author').value.trim();
      const link = document.getElementById('fav-link').value.trim();
      if (!circle) return;
      state.favorites.push({ id: 'fav_' + Date.now(), circle, author, link, isStarred: true });
      saveData(); closeModal(); render();
    }

    const manifest = {
      name: "場販計劃 - 同人展多人購物清單",
      short_name: "場販計劃",
      start_url: ".",
      display: "standalone",
      background_color: "#F4F5F0",
      theme_color: "#4A7C6F",
      icons: [{
        src: "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48cmVjdCB3aWR0aD0iMTAwIiBoZWlnaHQ9IjEwMCIgcng9IjIwIiBmaWxsPSIjNEE3QzZGIi8+PHRleHQgeD0iNTAiIHk9IjY4IiBmb250LXNpemU9IjU1IiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmaWxsPSJ3aGl0ZSI+📚</text></svg>",
        sizes: "192x192",
        type: "image/svg+xml"
      }]
    };
    document.getElementById('manifest-placeholder').setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifest)));

    initData();
  </script>
</body>
</html>
